        const db = firebase.firestore();

        // 웹 푸시 공개 키 (Firebase 콘솔 → 클라우드 메시징 → 웹 푸시 인증서). 공개되어도 괜찮은 값
        const VAPID_KEY = 'BHqFX4QGr9y53J_n_1C3KeOnuZbrGU6DmNJGZafzJudC6ksPRhoaimxILKzENnmkjKghRSDS2UVsRDqWkw7RTMs';

        // 관리자(모든 일정 수정/삭제 + 멤버 관리) — firestore.rules 의 isAdmin() 과 같게 유지
        const ADMIN_EMAILS = ['seongwan0517@gmail.com'];

        const BLOG = '블로그 협찬';
        const BLOG_COLOR = '#9b59b6';      // 블로그 협찬 공통 색
        const NEUTRAL_COLOR = '#808080';   // 작성자를 알 수 없는 일정
        // 처음 로그인한 순서대로 아직 안 쓰인 색을 한 명씩 고정 배정
        const USER_PALETTE = ['#2d7ff9', '#22c55e', '#f97316', '#ec4899', '#eab308', '#06b6d4', '#a16207', '#e5e7eb'];
        const PRESET_PLATFORMS = ['리뷰쉐어', '레뷰', '아싸뷰', '리뷰노트'];
        const PRESET_CONTENTS = ['블로그', '인스타', '쇼핑몰'];
        const DEADLINE_COLOR = '#e50914';
        let customOptions = { platforms: [], contentTypes: [] };   // config/options (팀 공용)
        let formPlatform = '';
        let formContents = [];
        const CATEGORY_SHORT = { '회사 일정': '회사', '개인 일정': '개인', '블로그 협찬': '협찬' };
        const CATEGORY_DASH_COLOR = { '회사 일정': '#64748b', '개인 일정': '#cbd5e1', '블로그 협찬': BLOG_COLOR };
        const FILTERS = [
            { v: 'all', label: '전체' },
            { v: '블로그 협찬', label: '협찬', color: BLOG_COLOR },
            { v: '회사 일정', label: '회사', color: '#64748b' },
            { v: '개인 일정', label: '개인', color: '#cbd5e1' }
        ];

        let currentUser = null;      // { uid, email, name, picture }
        let userColors = {};         // email -> { name, color }
        let members = [];            // config/access.emails (관리자만 불러옴)
        let calendar = null;
        let legend = [];
        let allEvents = null;        // 대시보드/임박한 일정용 (이번 달 ~ +90일)
        let upcomingEvents = [];
        let dayEvents = [];
        let currentDetail = null;
        let editingId = null;
        let dashMode = 'month';
        let catFilter = 'all';
        let appStarted = false;
        let selectedDate = null;

        const mq = window.matchMedia('(max-width: 767px)');
        const isMobile = () => mq.matches;

        // ===== 유틸 =====
        const pad = n => String(n).padStart(2, '0');
        const toDateStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        const toLocalInput = d => `${toDateStr(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        const startOfDay = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
        const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
        const WEEKDAYS = '일월화수목금토';
        const fmtMD = d => `${d.getMonth() + 1}월 ${d.getDate()}일 (${WEEKDAYS[d.getDay()]})`;
        const fmtTime = d => d.toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });
        const passFilter = ev => catFilter === 'all' || ev.category === catFilter;
        selectedDate = toDateStr(new Date());

        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function parseLocal(str) {
            if (!str) return null;
            if (/^\d{4}-\d{2}-\d{2}$/.test(str)) {
                const [y, m, d] = str.split('-').map(Number);
                return new Date(y, m - 1, d);
            }
            return new Date(str);
        }

        // 밝은 배경색 위에서는 어두운 글자
        function contrastText(hex) {
            const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
            if (!m) return '#fff';
            const n = parseInt(m[1], 16);
            const lum = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
            return lum > 0.65 ? '#111' : '#fff';
        }

        // ===== 데이터 (Firestore) =====
        // config/access : 로그인 허용 멤버 { emails: [...] }
        // events/{id}   : 일정. 종일 일정은 start/end 가 'yyyy-MM-dd'(end 는 다음 날, exclusive),
        //                 시간 일정은 ISO 문자열. startTs/endTs 는 기간 조회용 Timestamp.
        // users/{email} : 사람별 고정 색 { name, color }
        const ts = d => firebase.firestore.Timestamp.fromDate(d);
        const serverNow = () => firebase.firestore.FieldValue.serverTimestamp();
        const isAdmin = () => !!currentUser && ADMIN_EMAILS.includes(currentUser.email);

        function friendlyError(err) {
            if (err && err.code === 'permission-denied') return '권한이 없습니다. (작성자 본인만 수정/삭제할 수 있어요)';
            if (err && err.code === 'unavailable') return '서버에 연결할 수 없습니다. 인터넷 연결을 확인하세요.';
            return (err && err.message) || '요청 실패';
        }

        async function loadUsers() {
            const snap = await db.collection('users').get();
            userColors = {};
            snap.forEach(d => { userColors[d.id] = d.data(); });
            legend = Object.values(userColors).map(u => ({ name: u.name, color: u.color }));
        }

        // 처음 접속한 사람에게 아직 안 쓰인 색을 배정하고 저장 (이후 고정)
        async function ensureUser() {
            await loadUsers();
            const me = userColors[currentUser.email];
            if (me && me.name === currentUser.name) return;
            let color = me && me.color;
            if (!color) {
                const used = Object.values(userColors).map(u => u.color);
                const free = USER_PALETTE.filter(c => !used.includes(c));
                color = free.length ? free[0] : USER_PALETTE[Object.keys(userColors).length % USER_PALETTE.length];
            }
            await db.collection('users').doc(currentUser.email).set({ name: currentUser.name, color });
            await loadUsers();
        }

        function colorFor(d) {
            if (d.category === BLOG) return BLOG_COLOR;
            const u = userColors[d.authorEmail];
            return u ? u.color : NEUTRAL_COLOR;
        }

        function docToEvent(doc) {
            const d = doc.data();
            const color = colorFor(d);
            return {
                id: doc.id,
                title: d.title,
                allDay: !!d.allDay,
                start: d.start,
                end: d.end,
                backgroundColor: color,
                borderColor: color,
                extendedProps: {
                    category: d.category || '개인 일정',
                    author: d.authorName || '익명',
                    platform: d.platform || '',
                    memo: d.memo || '',
                    deadline: d.deadline || '',
                    link: d.link || '',
                    contentTypes: Array.isArray(d.contentTypes) ? d.contentTypes : [],
                    productValue: Number(d.productValue) || 0,
                    adFee: Number(d.adFee) || 0,
                    myCost: Number(d.myCost) || 0,
                    canEdit: isAdmin() || d.authorEmail === currentUser.email
                }
            };
        }

        // 협찬의 '제출 마감일'을 달력에 따로 보여주는 표시용 일정 (원래 일정 정보를 그대로 들고 있음)
        function deadlineMarker(ev) {
            const p = ev.extendedProps;
            return {
                id: ev.id + '__deadline',
                title: '마감 · ' + ev.title,
                allDay: true,
                start: p.deadline,
                end: toDateStr(addDays(parseLocal(p.deadline), 1)),
                backgroundColor: DEADLINE_COLOR,
                borderColor: DEADLINE_COLOR,
                extendedProps: { ...p, isDeadline: true, srcId: ev.id, srcStart: ev.start, srcEnd: ev.end, srcAllDay: ev.allDay }
            };
        }

        // [start, end) 기간과 겹치는 일정. withDeadlines 면 그 기간의 마감일 표시도 함께 만든다
        async function fetchEvents(start, end, withDeadlines = false) {
            // 마감일은 체험일보다 늦으므로, 조금 앞선 일정까지 가져와서 마감일이 기간 안인지 본다
            const from = withDeadlines ? addDays(start, -120) : start;
            const snap = await db.collection('events').where('endTs', '>', ts(from)).orderBy('endTs').get();
            const events = [];
            const s0 = toDateStr(start), e0 = toDateStr(end);
            snap.forEach(doc => {
                const d = doc.data();
                if (!d.startTs) return;
                const ev = docToEvent(doc);
                if (d.endTs.toDate() > start && d.startTs.toDate() < end) events.push(ev);
                if (withDeadlines && d.category === BLOG && d.deadline && d.deadline >= s0 && d.deadline < e0) events.push(deadlineMarker(ev));
            });
            return { events, legend };
        }

        // 금액 입력값 → 숫자 (쉼표 제거)
        const parseMoney = v => Math.max(0, Math.min(1000000000, Number(String(v || '').replace(/[^\d]/g, '')) || 0));
        const fmtMoney = n => (Number(n) || 0).toLocaleString('ko-KR');

        // 폼 값 → 저장할 문서. 종일 일정은 '포함' 종료일을 받아 다음 날(exclusive)로 바꿔 저장
        function buildEventData({ title, start, end, allDay, category, platform, memo,
                                  deadline = '', link = '', contentTypes = [], productValue = 0, adFee = 0, myCost = 0 }) {
            const blog = category === BLOG;
            let startDate, endDate, startStr, endStr;
            if (allDay) {
                startDate = parseLocal(start);
                const last = parseLocal(end);
                endDate = new Date(last.getFullYear(), last.getMonth(), last.getDate() + 1);
                startStr = toDateStr(startDate);
                endStr = toDateStr(endDate);
            } else {
                startDate = new Date(start);
                endDate = new Date(end);
                startStr = startDate.toISOString();
                endStr = endDate.toISOString();
            }
            return {
                title, category, memo, allDay,
                platform: blog ? platform : '',
                deadline: blog ? deadline : '',
                link: blog ? link : '',
                contentTypes: blog ? contentTypes : [],
                productValue: blog ? productValue : 0,
                adFee: blog ? adFee : 0,
                myCost: blog ? myCost : 0,
                start: startStr, end: endStr,
                startTs: ts(startDate), endTs: ts(endDate),
                updatedAt: serverNow()
            };
        }

        function addEventDoc(input) {
            return db.collection('events').add({
                ...buildEventData(input),
                authorEmail: currentUser.email,   // 보안 규칙이 로그인한 계정과 같은지 검사
                authorName: currentUser.name,
                createdAt: serverNow()
            });
        }
        const updateEventDoc = (id, input) => db.collection('events').doc(id).update(buildEventData(input));
        const deleteEventDoc = id => db.collection('events').doc(id).delete();

        // 다른 사람이 일정을 바꾸면 화면을 자동으로 새로고침
        let changeTimer = null;
        function watchChanges() {
            let first = true;
            const since = new Date(); since.setDate(since.getDate() - 400);
            db.collection('events').where('endTs', '>', ts(since)).onSnapshot(snap => {
                if (first) { first = false; return; }
                if (snap.metadata.hasPendingWrites) return;
                clearTimeout(changeTimer);
                changeTimer = setTimeout(refreshAll, 400);
            }, err => console.error(err));
        }

        // ===== 멤버 관리 (관리자) =====
        const accessRef = () => db.collection('config').doc('access');

        async function loadMembers() {
            const snap = await accessRef().get();
            members = (snap.exists && Array.isArray(snap.data().emails)) ? snap.data().emails : [];
        }

        function renderMembers() {
            const all = [...new Set([...ADMIN_EMAILS, ...members])];
            document.getElementById('member-list').innerHTML = all.map(email => {
                const admin = ADMIN_EMAILS.includes(email);
                const u = userColors[email];
                return `
                    <div class="flex items-center gap-3 rounded-xl px-3 py-3" style="background: var(--surface-2)">
                        <span class="w-9 h-9 rounded-full flex items-center justify-center font-bold text-sm shrink-0" style="background:${escapeHtml(u ? u.color : '#3f3f46')};color:${contrastText(u ? u.color : '#3f3f46')}">${escapeHtml((u ? u.name : email).slice(0, 1).toUpperCase())}</span>
                        <div class="min-w-0 flex-1">
                            <p class="font-semibold text-sm truncate">${escapeHtml(u ? u.name : '아직 로그인 안 함')}</p>
                            <p class="text-xs text-gray-400 truncate">${escapeHtml(email)}</p>
                        </div>
                        ${admin
                            ? '<span class="tag" style="background: rgba(229,9,20,.15); color:#f87171">관리자</span>'
                            : `<button onclick="removeMember('${escapeHtml(email)}')" class="text-xs font-bold text-gray-400 hover:text-red-400 px-2 py-1">삭제</button>`}
                    </div>`;
            }).join('');
        }

        async function openMembersModal() {
            if (!isAdmin()) return;
            document.getElementById('member-error').classList.add('hidden');
            document.getElementById('member-list').innerHTML = '<div class="empty">불러오는 중...</div>';
            openModal('members-modal');
            try { await loadMembers(); renderMembers(); }
            catch (err) { showMemberError(friendlyError(err)); }
        }

        function showMemberError(msg) {
            const el = document.getElementById('member-error');
            el.textContent = msg;
            el.classList.toggle('hidden', !msg);
        }

        async function saveMembers(list) {
            await accessRef().set({ emails: list });
            members = list;
            renderMembers();
        }

        async function addMember() {
            const input = document.getElementById('member-input');
            const email = input.value.trim().toLowerCase();
            showMemberError('');
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showMemberError('이메일 주소를 확인해 주세요.');
            if (ADMIN_EMAILS.includes(email) || members.includes(email)) return showMemberError('이미 등록된 계정입니다.');
            const btn = document.getElementById('btn-add-member');
            btn.disabled = true;
            try { await saveMembers([...members, email]); input.value = ''; }
            catch (err) { showMemberError('추가 실패: ' + friendlyError(err)); }
            finally { btn.disabled = false; }
        }

        async function removeMember(email) {
            if (!confirm(`${email} 계정을 멤버에서 뺄까요?\n이 계정은 더 이상 로그인할 수 없습니다.`)) return;
            try { await saveMembers(members.filter(e => e !== email)); }
            catch (err) { showMemberError('삭제 실패: ' + friendlyError(err)); }
        }

        document.getElementById('member-input').addEventListener('keydown', e => { if (e.key === 'Enter') addMember(); });

        // ===== 푸시 알림 =====
        // pushTokens/{토큰} = { email, platform, updatedAt } → 동기화 Apps Script 가 매일 아침 이 토큰으로 알림을 보냄
        const PUSH_KEY = 'nc_push_token';
        const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        let pushMsg = '';

        function pushSupported() {
            return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window
                && location.protocol === 'https:' && firebase.messaging.isSupported();
        }

        // 'on' | 'off' | 'blocked' | 'need-install' | 'unsupported'
        function pushState() {
            if (isIOS() && !isStandalone()) return 'need-install';
            if (!pushSupported()) return 'unsupported';
            if (Notification.permission === 'denied') return 'blocked';
            return Notification.permission === 'granted' && localStorage.getItem(PUSH_KEY) ? 'on' : 'off';
        }

        async function registerPushToken() {
            const reg = await navigator.serviceWorker.ready;
            const token = await firebase.messaging().getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
            if (!token) throw new Error('알림 토큰을 받지 못했습니다.');
            const old = localStorage.getItem(PUSH_KEY);
            if (old && old !== token) db.collection('pushTokens').doc(old).delete().catch(() => {});
            await db.collection('pushTokens').doc(token).set({
                email: currentUser.email,
                platform: (isIOS() ? 'iOS ' : '') + navigator.userAgent.slice(0, 90),
                updatedAt: serverNow()
            });
            localStorage.setItem(PUSH_KEY, token);
            return reg;
        }

        async function enablePush() {
            pushMsg = '';
            const st = pushState();
            if (st === 'need-install') { pushMsg = '아이폰은 Safari 공유 버튼 → "홈 화면에 추가"로 설치한 앱에서 켤 수 있어요.'; return renderPushUI(); }
            if (st === 'unsupported') { pushMsg = '이 브라우저는 알림을 지원하지 않아요.'; return renderPushUI(); }
            try {
                const perm = await Notification.requestPermission();
                if (perm !== 'granted') { pushMsg = '알림이 허용되지 않았어요. 휴대폰 설정에서 이 앱의 알림을 허용해 주세요.'; return renderPushUI(); }
                const reg = await registerPushToken();
                reg.showNotification('알림이 켜졌어요', {
                    body: '매일 아침 9시에 오늘 일정과 제출 마감을 알려드릴게요.',
                    icon: '/icons/icon-192.png', badge: '/icons/icon-192.png'
                });
                pushMsg = '알림이 켜졌어요. 매일 아침 9시에 알려드려요.';
            } catch (err) {
                console.error(err);
                pushMsg = '알림 켜기 실패: ' + friendlyError(err);
            }
            renderPushUI();
        }

        async function disablePush() {
            const token = localStorage.getItem(PUSH_KEY);
            try {
                if (token) await db.collection('pushTokens').doc(token).delete();
                if (pushSupported()) await firebase.messaging().deleteToken().catch(() => {});
            } catch (err) { console.error(err); }
            localStorage.removeItem(PUSH_KEY);
            pushMsg = '알림을 껐어요.';
            renderPushUI();
        }

        // 앱을 열 때마다 토큰을 최신으로 유지 (토큰은 가끔 바뀜)
        function refreshPushToken() {
            if (pushState() === 'on') registerPushToken().catch(err => console.error('알림 토큰 갱신 실패', err));
        }

        function renderPushUI() {
            const st = pushState();
            const text = {
                on: ['알림 켜짐', '매일 아침 9시에 오늘 일정과 마감을 알려드려요'],
                off: ['알림 꺼짐', '켜면 체험일·제출 마감을 휴대폰으로 알려드려요'],
                blocked: ['알림 차단됨', '휴대폰/브라우저 설정에서 이 사이트 알림을 허용해 주세요'],
                'need-install': ['홈 화면 앱에서 사용 가능', '공유 버튼 → "홈 화면에 추가" 후 그 앱에서 켜 주세요'],
                unsupported: ['알림 미지원', '이 브라우저에서는 알림을 받을 수 없어요']
            }[st];
            const btn = st === 'on'
                ? '<button onclick="disablePush()" class="btn-ghost px-4 py-2 text-sm shrink-0">끄기</button>'
                : (st === 'off' || st === 'need-install' ? '<button onclick="enablePush()" class="btn-primary px-4 py-2 text-sm shrink-0">켜기</button>' : '');
            const html = `
                <div class="flex items-center gap-3">
                    <span class="w-10 h-10 rounded-full flex items-center justify-center shrink-0" style="background:${st === 'on' ? 'rgba(74,222,128,.15)' : 'var(--surface-3)'}">
                        <i class="fa-solid ${st === 'on' ? 'fa-bell text-green-400' : 'fa-bell-slash text-gray-400'}"></i>
                    </span>
                    <div class="flex-1 min-w-0">
                        <p class="font-bold text-sm">${text[0]}</p>
                        <p class="text-xs text-gray-400 leading-relaxed">${text[1]}</p>
                    </div>
                    ${btn}
                </div>
                ${pushMsg ? `<p class="text-xs mt-3 text-gray-300">${escapeHtml(pushMsg)}</p>` : ''}`;
            document.querySelectorAll('.push-box').forEach(el => { el.innerHTML = html; });
        }

        // ===== 협찬 선택지 (플랫폼 / 콘텐츠 종류) =====
        const optionsRef = () => db.collection('config').doc('options');

        async function loadOptions() {
            try {
                const snap = await optionsRef().get();
                const d = snap.exists ? snap.data() : {};
                customOptions = {
                    platforms: Array.isArray(d.platforms) ? d.platforms : [],
                    contentTypes: Array.isArray(d.contentTypes) ? d.contentTypes : []
                };
            } catch (err) { console.error(err); }
        }

        const allPlatforms = () => [...new Set([...PRESET_PLATFORMS, ...customOptions.platforms])];
        const allContents = () => [...new Set([...PRESET_CONTENTS, ...customOptions.contentTypes])];

        function renderOptionChips() {
            const chip = (kind, v, on) =>
                `<button type="button" class="opt ${on ? 'on' : ''}" data-kind="${kind}" data-v="${escapeHtml(v)}" onclick="toggleOption(this)">${on && kind === 'content' ? '<i class="fa-solid fa-check mr-1 text-xs"></i>' : ''}${escapeHtml(v)}</button>`;
            const adder = (kind, text) => `
                <span class="opt-input hidden" id="add-${kind}-box">
                    <input type="text" maxlength="20" id="add-${kind}-input" placeholder="이름 입력" onkeydown="if(event.key==='Enter'){event.preventDefault();confirmAddOption('${kind}')}">
                    <button type="button" class="opt on" onclick="confirmAddOption('${kind}')">확인</button>
                </span>
                <button type="button" class="opt add" id="add-${kind}-btn" onclick="startAddOption('${kind}')"><i class="fa-solid fa-plus mr-1 text-xs"></i>${text}</button>`;

            // 지금 일정에 들어 있는 값이 목록에 없으면(예전 데이터) 함께 보여줌
            const plats = allPlatforms();
            if (formPlatform && !plats.includes(formPlatform)) plats.push(formPlatform);
            const conts = allContents();
            formContents.forEach(c => { if (!conts.includes(c)) conts.push(c); });

            document.getElementById('platform-chips').innerHTML =
                plats.map(v => chip('platform', v, v === formPlatform)).join('') + adder('platform', '플랫폼 추가');
            document.getElementById('content-chips').innerHTML =
                conts.map(v => chip('content', v, formContents.includes(v))).join('') + adder('content', '기타 추가');
        }

        function toggleOption(btn) {
            const v = btn.dataset.v;
            if (btn.dataset.kind === 'platform') formPlatform = formPlatform === v ? '' : v;
            else formContents = formContents.includes(v) ? formContents.filter(x => x !== v) : [...formContents, v];
            renderOptionChips();
        }

        function startAddOption(kind) {
            document.getElementById(`add-${kind}-btn`).classList.add('hidden');
            const box = document.getElementById(`add-${kind}-box`);
            box.classList.remove('hidden');
            document.getElementById(`add-${kind}-input`).focus();
        }

        async function confirmAddOption(kind) {
            const v = document.getElementById(`add-${kind}-input`).value.trim().slice(0, 20);
            if (!v) return renderOptionChips();
            const key = kind === 'platform' ? 'platforms' : 'contentTypes';
            const preset = kind === 'platform' ? PRESET_PLATFORMS : PRESET_CONTENTS;
            if (kind === 'platform') formPlatform = v;
            else if (!formContents.includes(v)) formContents = [...formContents, v];
            if (!preset.includes(v) && !customOptions[key].includes(v)) {
                customOptions = { ...customOptions, [key]: [...customOptions[key], v] };
                optionsRef().set({ platforms: customOptions.platforms, contentTypes: customOptions.contentTypes })
                    .catch(err => console.error('선택지 저장 실패', err));
            }
            renderOptionChips();
        }

        // 금액 입력: 숫자만 + 천 단위 쉼표, 순이익 계산
        function onMoneyInput(el) {
            const n = parseMoney(el.value);
            el.value = el.value.trim() === '' ? '' : fmtMoney(n);
            updateProfit();
        }

        function updateProfit() {
            const p = parseMoney(document.getElementById('ev-product').value)
                    + parseMoney(document.getElementById('ev-adfee').value)
                    - parseMoney(document.getElementById('ev-mycost').value);
            const el = document.getElementById('ev-profit');
            el.textContent = `${p < 0 ? '−' : ''}${fmtMoney(Math.abs(p))}원`;
            el.style.color = p < 0 ? '#f87171' : (p > 0 ? '#4ade80' : '');
        }

        // ===== 로그인 / 세션 =====
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });

        function showLoginError(msg) {
            const el = document.getElementById('login-error');
            el.textContent = msg || '';
            el.classList.toggle('hidden', !msg);
        }

        // 홈 화면에 추가해서 앱처럼 연 경우 (팝업이 막히므로 페이지 이동 방식으로 로그인)
        const isStandalone = () => window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;

        async function login() {
            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            showLoginError('');
            try {
                if (isStandalone()) return await auth.signInWithRedirect(provider);
                await auth.signInWithPopup(provider);
            } catch (err) {
                if (err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment') {
                    return auth.signInWithRedirect(provider);
                }
                if (err.code !== 'auth/popup-closed-by-user' && err.code !== 'auth/cancelled-popup-request') {
                    showLoginError('로그인 실패: ' + err.message);
                }
            } finally {
                btn.disabled = false;
            }
        }

        function logout(message) {
            if (message) sessionStorage.setItem('nc_login_msg', message);
            auth.signOut().finally(() => location.reload());
        }

        auth.getRedirectResult().catch(err => showLoginError('로그인 실패: ' + err.message));

        auth.onAuthStateChanged(async user => {
            if (!user || appStarted) return;
            currentUser = { uid: user.uid, email: (user.email || '').toLowerCase(), name: user.displayName || user.email, picture: user.photoURL };
            try {
                await ensureUser();   // 멤버가 아니면 보안 규칙이 여기서 막음
            } catch (err) {
                return logout(err.code === 'permission-denied'
                    ? `${currentUser.email} 계정은 등록된 멤버가 아닙니다. 관리자에게 등록을 요청하세요.`
                    : '로그인 처리 실패: ' + friendlyError(err));
            }
            enterApp();
            watchChanges();
        });

        function avatarHtml(size) {
            return currentUser.picture
                ? `<img src="${escapeHtml(currentUser.picture)}" class="w-full h-full object-cover" referrerpolicy="no-referrer" alt="">`
                : `<i class="fa-solid fa-user ${size === 'lg' ? 'text-2xl' : ''}"></i>`;
        }

        function enterApp() {
            appStarted = true;
            const loginScreen = document.getElementById('login-screen');
            loginScreen.classList.add('opacity-0');
            setTimeout(() => loginScreen.classList.add('hidden'), 500);

            const main = document.getElementById('main-app');
            main.classList.remove('hidden');
            main.classList.add('flex');

            document.getElementById('user-profile').innerHTML = `
                <button id="profile-btn" class="w-9 h-9 rounded-full bg-[#3a3f4b] overflow-hidden flex items-center justify-center text-gray-200" aria-label="내 계정">${avatarHtml()}</button>
                <div id="profile-menu" class="hidden absolute right-0 mt-2 w-64 rounded-xl shadow-2xl p-3 z-50" style="background: var(--surface-2); border: 1px solid var(--line)">
                    <p class="font-bold text-sm truncate">${escapeHtml(currentUser.name)}</p>
                    <p class="text-xs text-gray-400 truncate mb-3">${escapeHtml(currentUser.email || '')}</p>
                    <div class="push-box rounded-lg p-3 mb-2" style="background: var(--surface-3)" onclick="event.stopPropagation()"></div>
                    ${isAdmin() ? '<button onclick="openMembersModal()" class="w-full text-sm font-semibold text-left rounded-lg px-3 py-2.5 hover:bg-white/5 mb-1"><i class="fa-solid fa-user-group w-5 text-gray-400"></i> 멤버 관리</button>' : ''}
                    <button onclick="logout()" class="w-full text-sm font-semibold text-left rounded-lg px-3 py-2.5 hover:bg-white/5"><i class="fa-solid fa-arrow-right-from-bracket w-5 text-gray-400"></i> 로그아웃</button>
                </div>`;
            document.getElementById('profile-btn').addEventListener('click', e => {
                e.stopPropagation();
                if (isMobile()) return setTab('me');
                document.getElementById('profile-menu').classList.toggle('hidden');
            });

            loadOptions();
            renderMe();
            renderPushUI();
            refreshPushToken();
            renderFilterChips();
            renderLegend();
            setSide('home');
            setTab('home');
            initCalendar();
            loadSummary();
        }

        (() => {
            const msg = sessionStorage.getItem('nc_login_msg');
            if (msg) {
                showLoginError(msg);
                sessionStorage.removeItem('nc_login_msg');
            }
        })();

        // ===== 화면 전환 =====
        function setTab(tab) {
            document.body.dataset.tab = tab;
            document.querySelectorAll('[data-tab-btn]').forEach(b => b.classList.toggle('active', b.dataset.tabBtn === tab));
            document.querySelector('.app-main').scrollTop = 0;
            if (tab === 'calendar' && calendar) {
                calendar.updateSize();
                renderMobileDots();
                renderDayAgenda();
            }
        }

        function setSide(side) {
            document.body.dataset.side = side;
            document.querySelectorAll('[data-side-btn]').forEach(b => b.classList.toggle('active', b.dataset.sideBtn === side));
        }

        // ===== 필터 =====
        function renderFilterChips() {
            const html = FILTERS.map(f => `
                <button class="chip ${catFilter === f.v ? 'active' : ''}" onclick="setFilter('${f.v}')">
                    ${f.color ? `<span class="dot" style="background:${f.color}"></span>` : ''}${f.label}
                </button>`).join('');
            document.querySelectorAll('.filter-chips').forEach(el => { el.innerHTML = html; });
        }

        function setFilter(v) {
            catFilter = v;
            renderFilterChips();
            renderUpcoming();
            if (calendar) calendar.refetchEvents();
        }

        // ===== 범례 =====
        function renderLegend() {
            const chip = (name, color) => `<span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full inline-block" style="background:${escapeHtml(color)}"></span>${escapeHtml(name)}</span>`;
            const items = legend.map(u => chip(u.name + (currentUser && u.name === currentUser.name ? ' (나)' : ''), u.color));
            items.push(chip('블로그 협찬 (공통)', BLOG_COLOR));
            document.getElementById('legend').innerHTML = items.join('');
        }

        // ===== 내 정보 (모바일) =====
        function renderMe() {
            const row = (icon, label, onclick, extra = '') => `
                <button onclick="${onclick}" class="w-full flex items-center gap-3 px-4 py-4 text-left hover:bg-white/5 transition ${extra}">
                    <i class="${icon} w-5 text-gray-400"></i><span class="flex-1 font-semibold">${label}</span><i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
                </button>`;
            document.getElementById('me-box').innerHTML = `
                <div class="flex items-center gap-4 rounded-2xl p-5 mb-4" style="background: var(--surface-2)">
                    <span class="w-14 h-14 rounded-full bg-[#3a3f4b] overflow-hidden flex items-center justify-center text-gray-200 shrink-0">${avatarHtml('lg')}</span>
                    <div class="min-w-0">
                        <p class="text-lg font-extrabold truncate">${escapeHtml(currentUser.name)}</p>
                        <p class="text-sm text-gray-400 truncate">${escapeHtml(currentUser.email)}</p>
                        ${isAdmin() ? '<span class="tag mt-1.5" style="background: rgba(229,9,20,.15); color:#f87171">관리자</span>' : ''}
                    </div>
                </div>
                <div class="push-box rounded-2xl p-4 mb-4" style="background: var(--surface-2)"></div>
                <div class="rounded-2xl overflow-hidden divide-y divide-[#2e2e33]" style="background: var(--surface-2)">
                    ${isAdmin() ? row('fa-solid fa-user-group', '멤버 관리', 'openMembersModal()') : ''}
                    ${row('fa-solid fa-arrow-right-from-bracket', '로그아웃', 'logout()')}
                </div>
                <p class="text-xs text-gray-500 text-center mt-6">일정은 5분마다 구글 캘린더에도 자동으로 복사됩니다</p>`;
        }

        // ===== 캘린더 =====
        const TOOLBAR_DESKTOP = { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,timeGridDay' };
        const TOOLBAR_MOBILE = { left: 'prev', center: 'title', right: 'today next' };

        const applyStyle = ev => ({ ...ev, textColor: contrastText(ev.backgroundColor) });

        function initCalendar() {
            const m = isMobile();
            calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
                initialView: 'dayGridMonth',
                locale: 'ko',
                height: m ? 'auto' : '100%',
                fixedWeekCount: !m,
                dayMaxEvents: !m,
                eventDisplay: m ? 'none' : 'auto',
                nowIndicator: true,
                scrollTime: '08:00:00',
                headerToolbar: m ? TOOLBAR_MOBILE : TOOLBAR_DESKTOP,
                buttonText: { today: '오늘', month: '월', week: '주', day: '일' },
                dayCellContent: arg => arg.dayNumberText.replace('일', ''),
                allDayText: '종일',
                moreLinkText: n => `+${n}개`,
                eventTimeFormat: { hour: 'numeric', minute: '2-digit', omitZeroMinute: true, meridiem: 'short' },

                dateClick: info => {
                    if (isMobile()) {
                        selectedDate = info.dateStr.slice(0, 10);
                        highlightSelected();
                        renderDayAgenda();
                    } else {
                        openAddModal(info.dateStr, info.allDay);
                    }
                },
                eventClick: info => {
                    info.jsEvent.preventDefault();
                    openDetailsModal(fcToView(info.event));
                },
                datesSet: info => {
                    if (!isMobile()) return;
                    const cs = info.view.currentStart, ce = info.view.currentEnd;
                    const sel = parseLocal(selectedDate);
                    if (sel < cs || sel >= ce) {
                        const t = new Date();
                        selectedDate = (t >= cs && t < ce) ? toDateStr(t) : toDateStr(cs);
                    }
                    highlightSelected();
                    renderDayAgenda();
                },
                eventsSet: () => { renderMobileDots(); renderDayAgenda(); },
                events: (info, success, failure) => {
                    fetchEvents(info.start, info.end, true)
                        .then(r => {
                            legend = r.legend || legend;
                            renderLegend();
                            success(r.events.filter(ev => passFilter(ev.extendedProps)).map(applyStyle));
                        })
                        .catch(err => { console.error(err); failure(err); });
                }
            });
            calendar.render();
        }

        mq.addEventListener('change', () => {
            if (!calendar) return;
            const m = isMobile();
            calendar.setOption('headerToolbar', m ? TOOLBAR_MOBILE : TOOLBAR_DESKTOP);
            calendar.setOption('eventDisplay', m ? 'none' : 'auto');
            calendar.setOption('height', m ? 'auto' : '100%');
            calendar.setOption('fixedWeekCount', !m);
            calendar.setOption('dayMaxEvents', !m);
            if (m && calendar.view.type !== 'dayGridMonth') calendar.changeView('dayGridMonth');
            calendar.updateSize();
            renderMobileDots();
            highlightSelected();
            renderDayAgenda();
        });

        function renderMobileDots() {
            document.querySelectorAll('.nc-dots').forEach(n => n.remove());
            if (!isMobile() || !calendar) return;
            const map = {};
            calendar.getEvents().forEach(ev => {
                if (!ev.start) return;
                const color = ev.backgroundColor || NEUTRAL_COLOR;
                const end = ev.end || ev.start;
                let d = startOfDay(ev.start);
                do {
                    (map[toDateStr(d)] = map[toDateStr(d)] || []).push(color);
                    d = addDays(d, 1);
                } while (d < end);
            });
            Object.entries(map).forEach(([date, colors]) => {
                const frame = document.querySelector(`.fc-daygrid-day[data-date="${date}"] .fc-daygrid-day-frame`);
                if (!frame) return;
                const box = document.createElement('div');
                box.className = 'nc-dots';
                colors.slice(0, 4).forEach(c => {
                    const s = document.createElement('span');
                    s.style.background = c;
                    box.appendChild(s);
                });
                frame.appendChild(box);
            });
            highlightSelected();
        }

        function highlightSelected() {
            document.querySelectorAll('.nc-selected').forEach(n => n.classList.remove('nc-selected'));
            if (!isMobile()) return;
            const td = document.querySelector(`.fc-daygrid-day[data-date="${selectedDate}"]`);
            if (td) td.classList.add('nc-selected');
        }

        // ===== 데이터 변환 =====
        function normalize(ev) {
            const props = ev.extendedProps || {};
            const toDate = v => v instanceof Date ? v : parseLocal(v);
            // 마감일 표시를 누르면 원래 일정(체험일 기준)을 보여준다
            const src = props.isDeadline
                ? { id: props.srcId, title: ev.title.replace(/^마감 · /, ''), allDay: props.srcAllDay, start: props.srcStart, end: props.srcEnd }
                : ev;
            const start = toDate(src.start);
            let end = toDate(src.end);
            if (!end) end = start;
            return {
                id: src.id,
                title: src.title,
                allDay: !!src.allDay,
                start, end,
                color: props.isDeadline ? BLOG_COLOR : (ev.backgroundColor || NEUTRAL_COLOR),
                category: props.category || '개인 일정',
                author: props.author || '익명',
                platform: props.platform || '',
                memo: props.memo || '',
                deadline: props.deadline || '',
                link: props.link || '',
                contentTypes: props.contentTypes || [],
                productValue: props.productValue || 0,
                adFee: props.adFee || 0,
                myCost: props.myCost || 0,
                canEdit: !!props.canEdit
            };
        }
        const fcToView = ev => {
            const v = normalize({
                id: ev.id, title: ev.title, allDay: ev.allDay, start: ev.start, end: ev.end,
                backgroundColor: ev.backgroundColor, extendedProps: ev.extendedProps
            });
            if (ev.extendedProps && ev.extendedProps.isDeadline) v.deadlineView = true;   // 목록에서 '마감' 카드로 표시
            return v;
        };

        // ===== 카드 UI =====
        function categoryTag(ev) {
            const short = CATEGORY_SHORT[ev.category] || ev.category;
            const label = ev.category === BLOG && ev.platform ? `${short} · ${ev.platform}` : short;
            const style = ev.category === BLOG
                ? 'background: rgba(155,89,182,.18); color: #d6b4e6'
                : 'background: var(--surface-3); color: var(--muted)';
            return `<span class="tag" style="${style}">${escapeHtml(label)}</span>`;
        }

        // 시간 표시: 종일 / 기간 / 시각
        function timeText(ev) {
            if (ev.allDay) {
                const last = addDays(ev.end, -1);
                return toDateStr(last) > toDateStr(ev.start) ? `~ ${last.getMonth() + 1}/${last.getDate()}` : '종일';
            }
            return fmtTime(ev.start);
        }

        function cardHtml(ev, cls, idx) {
            const dl = !!ev.deadlineView;
            const deadlineTag = '<span class="tag" style="background: rgba(229,9,20,.18); color:#fca5a5"><i class="fa-solid fa-flag-checkered"></i> 제출 마감</span>';
            const contents = (ev.contentTypes || []).map(c => `<span class="tag" style="background: var(--surface-3); color: var(--muted)">${escapeHtml(c)}</span>`).join('');
            return `
                <div class="ev-card ${cls}" style="--c:${dl ? DEADLINE_COLOR : escapeHtml(ev.color)}" data-index="${idx}">
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-1.5 mb-1.5 flex-wrap">${dl ? deadlineTag : ''}${categoryTag(ev)}${contents}</div>
                        <div class="ev-title">${escapeHtml(ev.title)}</div>
                        <div class="ev-meta mt-1.5 flex items-center gap-1.5"><span class="w-2 h-2 rounded-full inline-block" style="background:${escapeHtml(ev.color)}"></span>${escapeHtml(ev.author)}${!dl && ev.deadline ? ` <span class="text-gray-500">· 마감 ${Number(ev.deadline.slice(5, 7))}/${Number(ev.deadline.slice(8, 10))}</span>` : ''}</div>
                    </div>
                    <div class="ev-time pt-0.5" style="${dl ? 'color:#fca5a5' : ''}">${dl ? '마감' : escapeHtml(timeText(ev))}</div>
                </div>`;
        }

        function ddayInfo(day) {
            const diff = Math.round((startOfDay(day) - startOfDay(new Date())) / 86400000);
            if (diff === 0) return { text: '오늘', hot: true, label: '오늘' };
            if (diff === 1) return { text: 'D-1', hot: true, label: '내일' };
            return { text: `D-${diff}`, hot: diff <= 3, label: '' };
        }

        // ===== 임박한 일정 + 대시보드 데이터 (이번 달/이번 주/오늘~90일을 한 번에) =====
        async function loadSummary() {
            try {
                const t = startOfDay(new Date());
                const monthStart = new Date(t.getFullYear(), t.getMonth(), 1);
                const monthEnd = new Date(t.getFullYear(), t.getMonth() + 1, 1);
                const weekStart = addDays(t, -t.getDay());
                const weekEnd = addDays(weekStart, 7);
                const horizon = addDays(t, 90);

                const from = new Date(Math.min(monthStart, weekStart));
                const to = new Date(Math.max(monthEnd, weekEnd, horizon));
                // 마감일이 남은 협찬을 놓치지 않도록 조금 앞선 일정까지 가져온다
                const r = await fetchEvents(addDays(from, -120), to);

                legend = r.legend || legend;
                renderLegend();
                allEvents = r.events.map(normalize);

                // 다가오는 일정 = 체험/일정 + 협찬 제출 마감일
                const now = new Date();
                const visits = allEvents
                    .filter(e => e.end > now && e.start < horizon)
                    .map(e => ({ ...e, listDate: e.start }));
                const deadlines = allEvents
                    .filter(e => e.category === BLOG && e.deadline)
                    .map(e => ({ ...e, deadlineView: true, listDate: parseLocal(e.deadline) }))
                    .filter(e => e.listDate >= t && e.listDate < horizon);
                upcomingEvents = [...visits, ...deadlines].sort((a, b) => a.listDate - b.listDate || (a.deadlineView ? 1 : -1));
                renderHero();
                renderUpcoming();
                renderDashboard();
            } catch (err) {
                const msg = `<div class="empty text-red-400">일정을 불러오지 못했습니다.<br><span class="text-xs text-gray-500">${escapeHtml(friendlyError(err))}</span></div>`;
                document.getElementById('upcoming-list').innerHTML = msg;
                document.getElementById('dashboard').innerHTML = '';
            }
        }

        // 모바일 홈 상단: 인사 + 요약
        function renderHero() {
            const t = new Date();
            document.getElementById('hero-date').textContent =
                t.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' });
            document.getElementById('hero-hello').textContent = `${currentUser.name}님, 안녕하세요`;
            if (!allEvents) return;
            const d0 = startOfDay(t), d1 = addDays(d0, 1);
            const w0 = addDays(d0, -d0.getDay()), w1 = addDays(w0, 7);
            const m0 = new Date(t.getFullYear(), t.getMonth(), 1), m1 = new Date(t.getFullYear(), t.getMonth() + 1, 1);
            const count = (s, e, f = () => true) => allEvents.filter(ev => overlaps(ev, s, e) && f(ev)).length;
            const tile = (num, label, color) => `
                <div class="rounded-2xl p-3.5" style="background: var(--surface-2)">
                    <div class="text-2xl font-extrabold" style="${color ? `color:${color}` : ''}">${num}</div>
                    <div class="text-xs text-gray-400 font-semibold mt-0.5">${label}</div>
                </div>`;
            const soon = allEvents.filter(ev => ev.category === BLOG && ev.deadline
                && parseLocal(ev.deadline) >= d0 && parseLocal(ev.deadline) < addDays(d0, 8)).length;
            document.getElementById('hero-stats').innerHTML =
                tile(count(d0, d1), '오늘 일정', '#fff') +
                tile(count(m0, m1, ev => ev.category === BLOG), '이번 달 협찬', BLOG_COLOR) +
                tile(soon, '마감 7일 이내', soon ? '#f87171' : '');
        }

        function renderUpcoming() {
            const list = document.getElementById('upcoming-list');
            const items = upcomingEvents.map((ev, i) => ({ ev, i })).filter(x => passFilter(x.ev));
            if (!items.length) {
                list.innerHTML = `<div class="empty">${catFilter === 'all' ? '예정된 일정이 없습니다.' : '이 종류의 예정된 일정이 없습니다.'}</div>`;
                return;
            }
            const today = startOfDay(new Date());
            const groups = [];
            let cur = null;
            items.forEach(x => {
                const d = x.ev.listDate || x.ev.start;
                const ongoing = d < today;
                const key = ongoing ? 'ongoing' : toDateStr(d);
                if (!cur || cur.key !== key) { cur = { key, day: ongoing ? today : startOfDay(d), ongoing, items: [] }; groups.push(cur); }
                cur.items.push(x);
            });
            list.innerHTML = groups.map(g => {
                const dd = ddayInfo(g.day);
                const head = g.ongoing
                    ? `<div class="group-head"><span class="group-date">진행 중</span><span class="dday hot">NOW</span></div>`
                    : `<div class="group-head"><span class="group-date">${fmtMD(g.day)}${dd.label ? `<small>${dd.label}</small>` : ''}</span><span class="dday ${dd.hot ? 'hot' : ''}">${dd.text}</span></div>`;
                return head + `<div class="space-y-2.5">${g.items.map(x => cardHtml(x.ev, 'upcoming-item', x.i)).join('')}</div>`;
            }).join('');
        }

        // ===== 일정 분석 대시보드 =====
        function setDashMode(mode) { dashMode = mode; renderDashboard(); }

        function periodRange(mode) {
            const t = startOfDay(new Date());
            let s, e, label;
            if (mode === 'week') {
                s = addDays(t, -t.getDay());
                e = addDays(s, 7);
                const last = addDays(e, -1);
                label = `이번 주 · ${s.getMonth() + 1}/${s.getDate()} ~ ${last.getMonth() + 1}/${last.getDate()}`;
            } else {
                s = new Date(t.getFullYear(), t.getMonth(), 1);
                e = new Date(t.getFullYear(), t.getMonth() + 1, 1);
                label = `이번 달 · ${t.getFullYear()}년 ${t.getMonth() + 1}월`;
            }
            return { s, e, label };
        }

        const overlaps = (ev, s, e) => {
            const end = ev.end > ev.start ? ev.end : new Date(ev.start.getTime() + 1);
            return ev.start < e && end > s;
        };

        function renderDashboard() {
            const box = document.getElementById('dashboard');
            if (!allEvents) return;
            const { s, e, label } = periodRange(dashMode);
            const evs = allEvents.filter(ev => overlaps(ev, s, e));
            const total = evs.length;

            // 종류별
            const by = { '회사 일정': 0, '개인 일정': 0, [BLOG]: 0 };
            evs.forEach(ev => { if (by[ev.category] !== undefined) by[ev.category]++; });
            const pct = n => total ? Math.round(n / total * 100) : 0;

            // 블로그 플랫폼별 (기본 플랫폼은 0개여도 표시, 나머지는 있는 것만)
            const blogs = evs.filter(ev => ev.category === BLOG);
            const platCount = {};
            PRESET_PLATFORMS.forEach(p => { platCount[p] = 0; });
            blogs.forEach(ev => { const k = ev.platform || '미지정'; platCount[k] = (platCount[k] || 0) + 1; });
            const plat = Object.fromEntries(Object.entries(platCount).sort((a, b) => b[1] - a[1]).slice(0, 8));
            const platMax = Math.max(1, ...Object.values(plat));

            // 콘텐츠 종류별
            const contCount = {};
            blogs.forEach(ev => (ev.contentTypes || []).forEach(c => { contCount[c] = (contCount[c] || 0) + 1; }));
            const contList = Object.entries(contCount).sort((a, b) => b[1] - a[1]);
            const contMax = Math.max(1, ...contList.map(([, v]) => v));

            // 협찬 금액
            const sum = k => blogs.reduce((a, ev) => a + (Number(ev[k]) || 0), 0);
            const money = { product: sum('productValue'), ad: sum('adFee'), cost: sum('myCost') };
            const profit = money.product + money.ad - money.cost;

            // 멤버별 (공통 일정인 블로그 협찬 제외)
            const membersCount = {};
            evs.filter(ev => ev.category !== BLOG).forEach(ev => {
                const m = membersCount[ev.author] || (membersCount[ev.author] = { count: 0, color: ev.color });
                m.count++;
            });
            const memberList = Object.entries(membersCount).sort((a, b) => b[1].count - a[1].count).slice(0, 6);
            const memberMax = Math.max(1, ...memberList.map(([, v]) => v.count));

            // 일자별
            const days = Math.round((e - s) / 86400000);
            const counts = [];
            for (let i = 0; i < days; i++) counts.push(evs.filter(ev => overlaps(ev, addDays(s, i), addDays(s, i + 1))).length);
            const maxC = Math.max(...counts, 0);
            const busiestIdx = maxC > 0 ? counts.indexOf(maxC) : -1;
            const todayStr = toDateStr(new Date());

            const bars = counts.map((c, i) => {
                const d = addDays(s, i);
                const h = c ? Math.max(14, Math.round(c / maxC * 100)) : 4;
                const isToday = toDateStr(d) === todayStr;
                return `<div class="flex-1 h-full flex flex-col justify-end" title="${d.getMonth() + 1}/${d.getDate()} · ${c}개">
                            <div class="rounded-sm ${isToday ? 'bg-netRed' : 'bg-[#5b5b63]'}" style="height:${h}%;${c ? '' : 'opacity:.35'}"></div>
                        </div>`;
            }).join('');
            const barLabels = dashMode === 'week'
                ? `<div class="flex gap-[2px] mt-1">${counts.map((_, i) => `<span class="flex-1 text-center text-[11px] text-gray-500">${WEEKDAYS[i]}</span>`).join('')}</div>`
                : `<div class="flex justify-between mt-1 text-[11px] text-gray-500"><span>1일</span><span>${days}일</span></div>`;

            const tile = (num, name, accent) => `
                <div class="rounded-2xl p-4" style="background: var(--surface-2)">
                    <div class="text-3xl font-extrabold" style="${accent ? `color:${accent}` : ''}">${num}</div>
                    <div class="text-sm text-gray-400 font-semibold mt-0.5">${name}</div>
                </div>`;

            const row = (name, n, max, color) => `
                <div class="flex items-center gap-3 text-sm">
                    <span class="w-20 shrink-0 text-gray-300 truncate">${escapeHtml(name)}</span>
                    <div class="flex-1 h-2.5 rounded-full overflow-hidden" style="background: var(--surface-3)"><div class="h-full rounded-full" style="width:${n ? Math.max(6, Math.round(n / max * 100)) : 0}%;background:${escapeHtml(color)}"></div></div>
                    <span class="w-6 text-right font-bold">${n}</span>
                </div>`;

            const stacked = total
                ? ['회사 일정', '개인 일정', BLOG].map(k => by[k] ? `<div style="width:${by[k] / total * 100}%;background:${CATEGORY_DASH_COLOR[k]}" title="${CATEGORY_SHORT[k]} ${by[k]}개"></div>` : '').join('')
                : '';
            const stackedLegend = ['회사 일정', '개인 일정', BLOG].map(k => `
                <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full inline-block" style="background:${CATEGORY_DASH_COLOR[k]}"></span>${CATEGORY_SHORT[k]} ${by[k]} (${pct(by[k])}%)</span>`).join('');

            const card = (title, body) => `<div class="rounded-2xl p-4 mb-3" style="background: var(--surface-2)"><h3 class="text-[15px] font-bold mb-3">${title}</h3>${body}</div>`;

            box.innerHTML = `
                <div class="flex items-center justify-between mb-1">
                    <h2 class="text-xl font-extrabold">일정 분석</h2>
                    <div class="flex rounded-lg overflow-hidden text-xs font-bold" style="background: var(--surface-3)">
                        <button onclick="setDashMode('week')" class="px-3 py-2 ${dashMode === 'week' ? 'bg-netRed' : 'hover:bg-white/5'}">이번 주</button>
                        <button onclick="setDashMode('month')" class="px-3 py-2 ${dashMode === 'month' ? 'bg-netRed' : 'hover:bg-white/5'}">이번 달</button>
                    </div>
                </div>
                <p class="text-sm text-gray-400 mb-4">${escapeHtml(label)}</p>

                <div class="grid grid-cols-2 gap-2.5 mb-3">
                    ${tile(total, '전체 일정')}
                    ${tile(by[BLOG], '블로그 협찬', BLOG_COLOR)}
                    ${tile(by['회사 일정'], '회사 일정')}
                    ${tile(by['개인 일정'], '개인 일정')}
                </div>

                ${total ? card('일정 구성', `
                    <div class="flex h-3 rounded-full overflow-hidden mb-3" style="background: var(--surface-3)">${stacked}</div>
                    <div class="flex flex-wrap gap-x-3 gap-y-1 text-xs text-gray-400">${stackedLegend}</div>`)
                    : '<div class="empty mb-3">이 기간에 등록된 일정이 없습니다.</div>'}

                ${card('협찬 금액', `
                    <div class="space-y-2 text-sm">
                        <div class="flex justify-between"><span class="text-gray-400">협찬 상품 가치</span><span class="font-bold">${fmtMoney(money.product)}원</span></div>
                        <div class="flex justify-between"><span class="text-gray-400">광고비 (받은 금액)</span><span class="font-bold">${fmtMoney(money.ad)}원</span></div>
                        <div class="flex justify-between"><span class="text-gray-400">내 지출금액</span><span class="font-bold">−${fmtMoney(money.cost)}원</span></div>
                        <div class="flex justify-between pt-2 mt-1 border-t" style="border-color: var(--line)">
                            <span class="font-bold">순이익</span>
                            <span class="font-extrabold text-base" style="color:${profit < 0 ? '#f87171' : '#4ade80'}">${profit < 0 ? '−' : ''}${fmtMoney(Math.abs(profit))}원</span>
                        </div>
                    </div>`)}

                ${card('블로그 협찬 플랫폼', `<div class="space-y-2.5">${Object.entries(plat).map(([k, v]) => row(k, v, platMax, BLOG_COLOR)).join('')}</div>`)}

                ${card('콘텐츠 종류', `<div class="space-y-2.5">${contList.length ? contList.map(([k, v]) => row(k, v, contMax, '#c084fc')).join('') : '<p class="text-sm text-gray-500">데이터가 없습니다.</p>'}</div>`)}

                ${card('멤버별 일정 <span class="text-xs font-normal text-gray-500">(협찬 제외)</span>',
                    `<div class="space-y-2.5">${memberList.length ? memberList.map(([name, v]) => row(name, v.count, memberMax, v.color)).join('') : '<p class="text-sm text-gray-500">데이터가 없습니다.</p>'}</div>`)}

                ${card('일자별 일정 수', `
                    <div class="flex items-end gap-[2px] h-20">${bars}</div>
                    ${barLabels}
                    <p class="text-sm text-gray-400 mt-3">${busiestIdx >= 0
                        ? `가장 바쁜 날: <span class="text-white font-bold">${fmtMD(addDays(s, busiestIdx))}</span> · ${maxC}개`
                        : '가장 바쁜 날: -'}</p>`)}`;
        }

        // ===== 모바일: 선택한 날짜의 일정 =====
        function renderDayAgenda() {
            if (!calendar || !isMobile()) return;
            const day = parseLocal(selectedDate);
            const next = addDays(day, 1);

            dayEvents = calendar.getEvents().filter(ev => {
                if (!ev.start) return false;
                const s = ev.start, e = ev.end || ev.start;
                return s < next && (e > day || (e.getTime() === s.getTime() && s >= day));
            }).map(fcToView).sort((a, b) => a.start - b.start);

            const todayStr = toDateStr(new Date());
            document.getElementById('day-title').textContent =
                day.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' }) + (selectedDate === todayStr ? ' · 오늘' : '');
            document.getElementById('day-count').textContent = dayEvents.length ? `${dayEvents.length}개` : '';

            const list = document.getElementById('day-list');
            if (!dayEvents.length) {
                list.innerHTML = '<div class="empty">일정이 없어요.<br>오른쪽 아래 + 버튼으로 추가하세요.</div>';
                return;
            }
            list.innerHTML = dayEvents.map((ev, i) => cardHtml(ev, 'agenda-item', i)).join('');
        }

        // ===== 클릭 처리 =====
        document.addEventListener('click', e => {
            const up = e.target.closest('.upcoming-item');
            if (up) return openDetailsModal(upcomingEvents[Number(up.dataset.index)]);
            const ag = e.target.closest('.agenda-item');
            if (ag) return openDetailsModal(dayEvents[Number(ag.dataset.index)]);
            const menu = document.getElementById('profile-menu');
            if (menu && !e.target.closest('#profile-menu')) menu.classList.add('hidden');
        });

        // ===== 모달 공통 =====
        const MODALS = ['add-modal', 'details-modal', 'members-modal'];

        function openModal(id) {
            const m = document.getElementById(id);
            m.classList.remove('hidden');
            setTimeout(() => m.classList.remove('opacity-0'), 10);
        }

        function closeModal(id) {
            const m = document.getElementById(id);
            m.classList.add('opacity-0');
            setTimeout(() => {
                m.classList.add('hidden');
                if (id === 'add-modal') document.getElementById('add-error').classList.add('hidden');
            }, 250);
        }

        MODALS.forEach(id => {
            document.getElementById(id).addEventListener('click', e => { if (e.target.id === id) closeModal(id); });
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') MODALS.forEach(id => {
                if (!document.getElementById(id).classList.contains('hidden')) closeModal(id);
            });
        });

        // ===== 등록 / 수정 폼 =====
        function pickCategory(v) {
            document.getElementById('ev-category').value = v;
            onCategoryChange();
        }

        function onCategoryChange() {
            const v = document.getElementById('ev-category').value;
            const blog = v === BLOG;
            document.querySelectorAll('#cat-seg button').forEach(b => b.classList.toggle('active', b.dataset.v === v));
            document.getElementById('blog-box').classList.toggle('hidden', !blog);
            document.getElementById('ev-title').placeholder = blog ? '스케줄 제목 (예: 강남 맛집 체험)' : '일정 제목';
            document.getElementById('lbl-start').textContent = blog ? '체험(방문) 시작' : '시작';
            document.getElementById('lbl-end').textContent = blog ? '체험(방문) 종료' : '종료';
            if (blog) renderOptionChips();
        }

        function applyAllDayMode() {
            const allDay = document.getElementById('ev-allday').checked;
            const s = document.getElementById('ev-start');
            const e = document.getElementById('ev-end');
            const sd = (s.value || '').slice(0, 10);
            const ed = (e.value || '').slice(0, 10) || sd;
            s.type = e.type = allDay ? 'date' : 'datetime-local';
            s.value = allDay ? sd : `${sd}T09:00`;
            e.value = allDay ? ed : `${ed}T10:00`;
        }

        function resetForm() {
            document.getElementById('ev-title').value = '';
            document.getElementById('ev-memo').value = '';
            document.getElementById('ev-category').value = catFilter !== 'all' ? catFilter : '회사 일정';
            document.getElementById('ev-deadline').value = '';
            document.getElementById('ev-link').value = '';
            ['ev-product', 'ev-adfee', 'ev-mycost'].forEach(id => { document.getElementById(id).value = ''; });
            formPlatform = '';
            formContents = [];
            updateProfit();
            onCategoryChange();
        }

        function openAddModal(dateStr, allDay = true) {
            editingId = null;
            resetForm();
            document.getElementById('modal-title').textContent = '새 일정 등록';
            document.getElementById('btn-save').textContent = '등록하기';

            const s = document.getElementById('ev-start');
            const e = document.getElementById('ev-end');
            document.getElementById('ev-allday').checked = allDay;
            s.type = e.type = allDay ? 'date' : 'datetime-local';
            if (allDay) {
                const day = (dateStr || toDateStr(new Date())).slice(0, 10);
                s.value = e.value = day;
            } else {
                const start = new Date(dateStr);
                s.value = toLocalInput(start);
                e.value = toLocalInput(new Date(start.getTime() + 3600000));
            }
            document.getElementById('ev-author').textContent = currentUser.name;
            openModal('add-modal');
        }

        function openEditModal(ev) {
            editingId = ev.id;
            resetForm();
            document.getElementById('modal-title').textContent = '일정 수정';
            document.getElementById('btn-save').textContent = '저장하기';
            document.getElementById('ev-title').value = ev.title;
            document.getElementById('ev-memo').value = ev.memo;
            document.getElementById('ev-category').value = ev.category;
            if (ev.category === BLOG) {
                formPlatform = ev.platform || '';
                formContents = [...(ev.contentTypes || [])];
                document.getElementById('ev-deadline').value = ev.deadline || '';
                document.getElementById('ev-link').value = ev.link || '';
                document.getElementById('ev-product').value = ev.productValue ? fmtMoney(ev.productValue) : '';
                document.getElementById('ev-adfee').value = ev.adFee ? fmtMoney(ev.adFee) : '';
                document.getElementById('ev-mycost').value = ev.myCost ? fmtMoney(ev.myCost) : '';
                updateProfit();
            }
            onCategoryChange();

            const s = document.getElementById('ev-start');
            const e = document.getElementById('ev-end');
            document.getElementById('ev-allday').checked = ev.allDay;
            s.type = e.type = ev.allDay ? 'date' : 'datetime-local';
            if (ev.allDay) {
                const last = addDays(ev.end, -1); // 종료일은 exclusive
                s.value = toDateStr(ev.start);
                e.value = toDateStr(last < ev.start ? ev.start : last);
            } else {
                s.value = toLocalInput(ev.start);
                e.value = toLocalInput(ev.end);
            }
            document.getElementById('ev-author').textContent = ev.author;
            openModal('add-modal');
        }

        // ===== 상세 모달 =====
        function openDetailsModal(ev) {
            if (!ev) return;
            currentDetail = ev;
            document.getElementById('detail-title').textContent = ev.title;
            document.getElementById('detail-author').textContent = ev.author;
            document.getElementById('detail-badge').textContent = CATEGORY_SHORT[ev.category] || ev.category;
            document.getElementById('detail-cover').style.backgroundColor = ev.color;

            const blog = ev.category === BLOG;
            const platRow = document.getElementById('detail-platform-row');
            platRow.classList.toggle('hidden', !(blog && ev.platform));
            document.getElementById('detail-platform').textContent = ev.platform;

            // 협찬 전용: 마감일 / 콘텐츠 / 링크 / 비용
            const dlRow = document.getElementById('detail-deadline-row');
            dlRow.classList.toggle('hidden', !(blog && ev.deadline));
            if (blog && ev.deadline) {
                const dd = ddayInfo(parseLocal(ev.deadline));
                const past = parseLocal(ev.deadline) < startOfDay(new Date());
                document.getElementById('detail-deadline').innerHTML =
                    `제출 마감 ${escapeHtml(fmtMD(parseLocal(ev.deadline)))} <span class="dday ${dd.hot && !past ? 'hot' : ''} ml-1">${past ? '마감 지남' : dd.text}</span>`;
            }
            const contRow = document.getElementById('detail-content-row');
            contRow.classList.toggle('hidden', !(blog && ev.contentTypes && ev.contentTypes.length));
            document.getElementById('detail-content').textContent = (ev.contentTypes || []).join(', ');

            const linkRow = document.getElementById('detail-link-row');
            const safeLink = /^https?:\/\//i.test(ev.link || '') ? ev.link : '';
            linkRow.classList.toggle('hidden', !(blog && safeLink));
            const a = document.getElementById('detail-link');
            a.textContent = safeLink ? '캠페인 페이지 열기' : '';
            if (safeLink) a.href = safeLink; else a.removeAttribute('href');

            const moneyRow = document.getElementById('detail-money-row');
            const hasMoney = blog && (ev.productValue || ev.adFee || ev.myCost);
            moneyRow.classList.toggle('hidden', !hasMoney);
            if (hasMoney) {
                const profit = ev.productValue + ev.adFee - ev.myCost;
                const line = (k, v) => `<div class="flex justify-between"><span class="text-gray-400">${k}</span><span class="font-bold">${v}</span></div>`;
                moneyRow.innerHTML =
                    line('협찬 상품 가치', fmtMoney(ev.productValue) + '원') +
                    line('광고비', fmtMoney(ev.adFee) + '원') +
                    line('내 지출', '−' + fmtMoney(ev.myCost) + '원') +
                    `<div class="flex justify-between pt-1.5 border-t" style="border-color: var(--line)"><span class="font-bold">순이익</span><span class="font-extrabold" style="color:${profit < 0 ? '#f87171' : '#4ade80'}">${profit < 0 ? '−' : ''}${fmtMoney(Math.abs(profit))}원</span></div>`;
            }

            const memoRow = document.getElementById('detail-memo-row');
            memoRow.classList.toggle('hidden', !ev.memo);
            document.getElementById('detail-memo').textContent = ev.memo;

            document.getElementById('detail-actions').classList.toggle('hidden', !ev.canEdit);

            const dOpt = { month: 'short', day: 'numeric', weekday: 'short' };
            const tOpt = { hour: '2-digit', minute: '2-digit' };
            let text;
            if (ev.allDay) {
                const last = addDays(ev.end, -1);
                text = toDateStr(last) <= toDateStr(ev.start)
                    ? `${ev.start.toLocaleDateString('ko-KR', dOpt)} · 종일`
                    : `${ev.start.toLocaleDateString('ko-KR', dOpt)} ~ ${last.toLocaleDateString('ko-KR', dOpt)} · 종일`;
            } else {
                const sameDay = toDateStr(ev.start) === toDateStr(ev.end);
                text = `${ev.start.toLocaleDateString('ko-KR', dOpt)} ${ev.start.toLocaleTimeString('ko-KR', tOpt)} ~ ` +
                       (sameDay ? '' : ev.end.toLocaleDateString('ko-KR', dOpt) + ' ') + ev.end.toLocaleTimeString('ko-KR', tOpt);
            }
            document.getElementById('detail-time').textContent = text;
            openModal('details-modal');
        }

        function startEdit() {
            if (!currentDetail) return;
            closeModal('details-modal');
            openEditModal(currentDetail);
        }

        async function deleteCurrent() {
            if (!currentDetail || !confirm(`'${currentDetail.title}' 일정을 삭제할까요?\n삭제하면 되돌릴 수 없습니다.`)) return;
            const btn = document.getElementById('btn-delete');
            btn.disabled = true;
            try {
                await deleteEventDoc(currentDetail.id);
                closeModal('details-modal');
                refreshAll();
            } catch (err) {
                alert('삭제 실패: ' + friendlyError(err));
            } finally {
                btn.disabled = false;
            }
        }

        async function refreshAll() {
            try { await loadUsers(); renderLegend(); } catch (err) { console.error(err); }
            calendar.refetchEvents();
            loadSummary();
        }

        // ===== 저장 (등록 / 수정) =====
        async function saveEvent() {
            const titleEl = document.getElementById('ev-title');
            const errEl = document.getElementById('add-error');
            const btn = document.getElementById('btn-save');
            const title = titleEl.value.trim();
            const startVal = document.getElementById('ev-start').value;
            const endVal = document.getElementById('ev-end').value;
            const allDay = document.getElementById('ev-allday').checked;
            const category = document.getElementById('ev-category').value;
            const memo = document.getElementById('ev-memo').value.trim();

            const showError = msg => { errEl.textContent = msg; errEl.classList.remove('hidden'); };
            errEl.classList.add('hidden');

            if (!title) { titleEl.style.borderColor = '#e50914'; setTimeout(() => titleEl.style.borderColor = '', 2000); return showError('제목을 입력하세요.'); }

            let platform = '', blogFields = {};
            if (category === BLOG) {
                platform = formPlatform;
                if (!platform) return showError('협찬 플랫폼을 선택하거나 추가하세요.');
                let link = document.getElementById('ev-link').value.trim();
                if (link && !/^https?:\/\//i.test(link)) link = 'https://' + link;
                blogFields = {
                    deadline: document.getElementById('ev-deadline').value,
                    link,
                    contentTypes: formContents,
                    productValue: parseMoney(document.getElementById('ev-product').value),
                    adFee: parseMoney(document.getElementById('ev-adfee').value),
                    myCost: parseMoney(document.getElementById('ev-mycost').value)
                };
                if (blogFields.deadline && blogFields.deadline < startVal.slice(0, 10)) return showError('제출 마감일이 체험일보다 빠릅니다.');
            }
            if (!startVal || !endVal) return showError('시작/종료 시간을 입력하세요.');

            let start, end;
            if (allDay) {
                if (endVal < startVal) return showError('종료일이 시작일보다 빠릅니다.');
                start = startVal; end = endVal;
            } else {
                const s = new Date(startVal), e = new Date(endVal);
                if (e <= s) return showError('종료 시간이 시작 시간보다 늦어야 합니다.');
                start = s.toISOString(); end = e.toISOString();
            }

            const label = btn.textContent;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 저장 중...';
            btn.disabled = true;
            try {
                const input = { title, start, end, allDay, category, platform, memo, ...blogFields };
                if (editingId) await updateEventDoc(editingId, input);
                else await addEventDoc(input);
                closeModal('add-modal');
                refreshAll();
            } catch (err) {
                showError('오류: ' + friendlyError(err));
            } finally {
                btn.textContent = label;
                btn.disabled = false;
            }
        }

        // ===== 앱 설치(PWA) =====
        if ('serviceWorker' in navigator && location.protocol === 'https:') {
            navigator.serviceWorker.register('/sw.js').catch(err => console.error('서비스 워커 등록 실패', err));
        }
    </script>
</body>
</html>
