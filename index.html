<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Style Calendar</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FullCalendar JS -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    
    <!-- Google Fonts & FontAwesome & Google Login -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { netRed: '#e50914', netBg: '#141414', netCard: '#2f2f2f' }
                }
            }
        }
    </script>

    <style>
        body { background-color: #141414; color: #ffffff; font-family: 'Inter', sans-serif; overflow: hidden; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #141414; }
        ::-webkit-scrollbar-thumb { background: #404040; border-radius: 4px; }
        
        /* FullCalendar Netflix Dark Theme Overrides */
        :root {
            --fc-page-bg-color: #141414;
            --fc-border-color: #333333;
            --fc-button-bg-color: #2f2f2f;
            --fc-button-hover-bg-color: #404040;
            --fc-button-active-bg-color: #e50914;
            --fc-today-bg-color: rgba(229, 9, 20, 0.15);
        }
        .fc-theme-standard td, .fc-theme-standard th { border-color: #2f2f2f; }
        .fc .fc-toolbar-title { font-size: 1.5rem; font-weight: 700; }
        .fc .fc-daygrid-day-number { padding: 8px; font-weight: 500; cursor: pointer; transition: color 0.2s; }
        .fc .fc-daygrid-day-number:hover { color: #e50914; }
        .fc-h-event { cursor: pointer; transition: transform 0.2s; border: none; }
        .fc-h-event:hover { transform: scale(1.02); filter: brightness(1.2); }

        /* Custom Inputs & Modals */
        .net-input { background-color: #333; border: 1px solid #404040; color: white; border-radius: 4px; padding: 0.75rem 1rem; width: 100%; outline: none; }
        .net-input:focus { border-color: #e50914; }
        .net-input::-webkit-calendar-picker-indicator { filter: invert(1); }
        
        .modal-overlay { backdrop-filter: blur(5px); background-color: rgba(0, 0, 0, 0.75); transition: opacity 0.3s ease; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- 1. 로그인 화면 -->
    <div id="login-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#141414] transition-opacity duration-500">
        <h1 class="text-6xl font-black text-[#e50914] mb-2 tracking-tighter uppercase">NetCalendar</h1>
        <p class="text-gray-400 mb-10 text-lg">팀 캘린더에 입장하려면 로그인하세요</p>
        <div id="g_id_onload"
             data-client_id="478451428995-2crtpdco8bt3mnm9vp19upqabeqbtj89.apps.googleusercontent.com"
             data-callback="handleCredentialResponse">
        </div>
        <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-size="large"></div>
    </div>

    <!-- 2. 메인 앱 화면 -->
    <div id="main-app" class="hidden flex-col h-full">
        <!-- 헤더 -->
        <header class="w-full bg-black py-4 px-8 flex justify-between items-center border-b border-[#2f2f2f] shrink-0">
            <div class="text-netRed font-black text-3xl tracking-tighter uppercase">NetCalendar</div>
            <div id="user-profile" class="flex items-center gap-3 text-sm font-bold text-gray-300"></div>
        </header>

        <!-- 좌우 분할 콘텐츠 -->
        <main class="flex-grow flex flex-row overflow-hidden">
            <!-- 좌측: 캘린더 (50%) -->
            <div class="w-1/2 h-full p-8 border-r border-[#2f2f2f] overflow-y-auto">
                <div id="calendar" class="w-full h-full min-h-[600px]"></div>
            </div>

            <!-- 우측: 임박한 일정 (50%) -->
            <div class="w-1/2 h-full bg-[#181818] p-8 flex flex-col">
                <div class="flex items-center justify-between mb-8 shrink-0 border-b border-[#2f2f2f] pb-4">
                    <h2 class="text-2xl font-bold">임박한 일정 <i class="fa-solid fa-fire text-netRed ml-1"></i></h2>
                    <span class="bg-netRed text-white text-xs font-bold px-3 py-1 rounded">UPCOMING</span>
                </div>
                <div id="upcoming-list" class="flex-grow overflow-y-auto pr-4 space-y-4">
                    <!-- 로딩 상태 표시 -->
                    <div class="text-gray-500 text-center py-10"><i class="fa-solid fa-spinner fa-spin mr-2"></i> 일정을 불러오는 중...</div>
                </div>
            </div>
        </main>
    </div>

    <!-- 3. 모달: 새 일정 등록 -->
    <div id="add-modal" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4 opacity-0">
        <div class="bg-[#181818] rounded-lg shadow-2xl w-full max-w-md border border-gray-700 overflow-hidden">
            <div class="p-6 border-b border-[#2f2f2f] flex justify-between items-center bg-[#222]">
                <h3 class="text-xl font-bold">새 일정 등록</h3>
                <button onclick="closeModal('add-modal')" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-6 space-y-5">
                <input type="text" id="ev-title" class="net-input text-lg font-bold" placeholder="일정 제목" required>
                
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block text-xs text-gray-400 mb-1">시작</label>
                        <input type="datetime-local" id="ev-start" class="net-input" required>
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs text-gray-400 mb-1">종료</label>
                        <input type="datetime-local" id="ev-end" class="net-input" required>
                    </div>
                </div>

                <label class="flex items-center gap-2 cursor-pointer w-max">
                    <input type="checkbox" id="ev-allday" class="w-4 h-4 accent-netRed cursor-pointer">
                    <span class="text-sm">종일(All-Day) 일정</span>
                </label>

                <div class="flex gap-4">
                    <div class="flex-1">
                        <input type="text" id="ev-author" class="net-input bg-[#222] text-gray-400 cursor-not-allowed" readonly>
                    </div>
                    <div class="flex-1">
                        <select id="ev-category" class="net-input cursor-pointer" required>
                            <option value="회사 일정">🏢 회사 일정</option>
                            <option value="개인 일정">👤 개인 일정</option>
                            <option value="블로그 협찬">📝 블로그 협찬</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="p-6 pt-0 flex gap-3">
                <button onclick="saveEvent()" id="btn-save" class="flex-1 bg-netRed hover:bg-[#b1060e] text-white font-bold py-3 rounded transition shadow-[0_4px_10px_rgba(229,9,20,0.3)]">등록하기</button>
                <button onclick="closeModal('add-modal')" class="flex-1 bg-transparent border border-gray-500 hover:border-white text-white font-bold py-3 rounded transition">취소</button>
            </div>
        </div>
    </div>

    <!-- 4. 모달: 일정 상세 보기 -->
    <div id="details-modal" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4 opacity-0">
        <div class="bg-[#181818] rounded-lg shadow-2xl w-full max-w-sm overflow-hidden border border-gray-700">
            <div class="h-32 w-full relative bg-[#2f2f2f] flex flex-col justify-end p-6" id="detail-cover">
                <button onclick="closeModal('details-modal')" class="absolute top-4 right-4 w-8 h-8 bg-black/50 rounded-full text-white hover:bg-white hover:text-black transition flex items-center justify-center z-10"><i class="fa-solid fa-xmark"></i></button>
                <div class="z-10 relative">
                    <span id="detail-badge" class="text-xs font-bold px-2 py-1 rounded bg-black/70 text-white mb-2 inline-block border border-white"></span>
                    <h3 id="detail-title" class="text-2xl font-bold text-white drop-shadow-md"></h3>
                </div>
                <div class="absolute inset-0 bg-gradient-to-t from-[#181818] to-transparent"></div>
            </div>
            <div class="p-6 space-y-4">
                <div class="flex items-center gap-3 text-gray-300">
                    <i class="fa-regular fa-clock text-netRed w-5 text-center"></i>
                    <p id="detail-time" class="font-medium text-white"></p>
                </div>
                <div class="flex items-center gap-3 text-gray-300">
                    <i class="fa-solid fa-user text-netRed w-5 text-center"></i>
                    <p id="detail-author" class="font-medium text-white"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyEp13vz9Ey2JtP_iuNqoeZPnAySDUFiy3OT3Afu3YEz-i4knIXYRYQn4hnRF7wEr4g/exec";
        
        let currentUser = null;
        let calendar = null;

        // JWT 디코딩 (구글 로그인 정보 추출)
        function decodeJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            return JSON.parse(decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
        }

        // 로그인 성공 시
        function handleCredentialResponse(response) {
            currentUser = decodeJwt(response.credential);
            
            // 로그인 화면 페이드 아웃
            const loginScreen = document.getElementById('login-screen');
            loginScreen.classList.add('opacity-0');
            setTimeout(() => {
                loginScreen.classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('main-app').classList.add('flex');
                
                // 유저 프로필 세팅
                document.getElementById('user-profile').innerHTML = `
                    <img src="${currentUser.picture}" class="w-8 h-8 rounded border border-gray-600" referrerpolicy="no-referrer">
                    <span>${currentUser.name}</span>
                `;
                
                initCalendar();
            }, 500);
        }

        // 캘린더 초기화
     function initCalendar() {
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'ko',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth'
                },
                selectable: true,
                select: function(info) {
                    openAddModal(info.startStr, info.endStr, info.allDay);
                    calendar.unselect();
                },
                events: function(info, successCallback, failureCallback) {
                    // 💡 핵심 해결책: 끝에 &t=현재시간 을 붙여 무조건 새로고침된 데이터를 받아오게 함
                    const fetchUrl = `${GAS_API_URL}?action=getEvents&start=${info.startStr}&end=${info.endStr}&t=${new Date().getTime()}`;
                    
                    // 💡 cache: 'no-store' 옵션 추가
                    fetch(fetchUrl, { cache: 'no-store' })
                        .then(res => res.json())
                        .then(data => {
                            allEventsData = data; 
                            renderUpcomingEvents(data); // 우측 임박한 일정 업데이트
                            successCallback(data);
                        })
                        .catch(err => failureCallback(err));
                }
            });
            calendar.render();
        }

                // API 데이터 연동
                events: function(info, successCallback, failureCallback) {
                    fetch(`${GAS_API_URL}?action=getEvents&start=${info.startStr}&end=${info.endStr}`)
                        .then(res => res.json())
                        .then(data => {
                            successCallback(data);
                            updateSidebar(data); // 캘린더 로딩 성공 시 사이드바도 같이 업데이트
                        })
                        .catch(err => {
                            console.error(err);
                            failureCallback(err);
                        });
                }
            });
            calendar.render();
        }

        // 우측 임박한 일정 UI 업데이트
        function updateSidebar(events) {
            const list = document.getElementById('upcoming-list');
            const now = new Date();
            now.setHours(0,0,0,0);

            // 미래 일정 필터링 및 정렬
            const upcoming = events.filter(ev => new Date(ev.start) >= now)
                                   .sort((a, b) => new Date(a.start) - new Date(b.start));

            if(upcoming.length === 0) {
                list.innerHTML = '<div class="text-gray-500 text-center py-10 bg-[#222] rounded-lg border border-[#333]">예정된 일정이 없습니다.</div>';
                return;
            }

            list.innerHTML = upcoming.map(ev => {
                const dateObj = new Date(ev.start);
                const diffDays = Math.ceil(Math.abs(dateObj - now) / (1000 * 60 * 60 * 24));
                const dDayText = diffDays === 0 ? 'D-Day' : `D-${diffDays}`;
                const dDayStyle = diffDays <= 3 ? 'bg-netRed text-white' : 'bg-[#333] text-gray-300';
                
                const props = ev.extendedProps || {};
                const author = props.author || '익명';
                const category = props.category || '기타';

                return `
                    <div class="bg-[#222] rounded-lg p-5 border-l-4 hover:bg-[#2a2a2a] transition cursor-pointer shadow-lg group" 
                         style="border-left-color: ${ev.backgroundColor}"
                         onclick="triggerEventClick('${ev.id}')">
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-xs font-bold px-2 py-1 rounded ${dDayStyle}">${dDayText}</span>
                            <span class="text-sm text-gray-400 font-medium">${dateObj.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', weekday: 'short' })}</span>
                        </div>
                        <h4 class="font-bold text-xl text-white mb-2 truncate group-hover:text-netRed transition-colors">${ev.title}</h4>
                        <div class="flex justify-between text-sm text-gray-400">
                            <span class="flex items-center gap-2"><span class="w-2 h-2 rounded-full" style="background-color: ${ev.backgroundColor}"></span>${category}</span>
                            <span><i class="fa-solid fa-user text-xs mr-1"></i>${author}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 모달 열기 애니메이션
        function openModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
        }

        // 모달 닫기 애니메이션
        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                if(modalId === 'add-modal') {
                    document.getElementById('ev-title').value = '';
                }
            }, 300);
        }

        // 새 일정 추가 모달 세팅
        function openAddModal(start, end, allDay) {
            document.getElementById('ev-allday').checked = allDay;
            document.getElementById('ev-author').value = currentUser.name; // 작성자 자동 입력
            
            if(allDay) {
                document.getElementById('ev-start').value = start + 'T09:00';
                let endDate = new Date(end);
                endDate.setDate(endDate.getDate() - 1);
                document.getElementById('ev-end').value = endDate.toISOString().split('T')[0] + 'T18:00';
            } else {
                document.getElementById('ev-start').value = start.slice(0, 16);
                document.getElementById('ev-end').value = end.slice(0, 16);
            }
            openModal('add-modal');
        }

        // 상세보기 모달 세팅
        function openDetailsModal(event) {
            document.getElementById('detail-title').innerText = event.title;
            
            const startStr = event.start.toLocaleString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' });
            const endStr = event.end ? event.end.toLocaleString('ko-KR', { hour: '2-digit', minute:'2-digit' }) : '';
            document.getElementById('detail-time').innerText = event.allDay ? '종일 일정' : `${startStr} ~ ${endStr}`;
            
            const props = event.extendedProps || {};
            document.getElementById('detail-author').innerText = props.author || '작성자 미상';
            
            const cover = document.getElementById('detail-cover');
            cover.style.backgroundColor = event.backgroundColor;
            
            const badge = document.getElementById('detail-badge');
            badge.innerText = props.category || '기타';
            
            openModal('details-modal');
        }

        // 사이드바 클릭 시 이벤트 연동
        function triggerEventClick(eventId) {
            const ev = calendar.getEventById(eventId);
            if(ev) openDetailsModal(ev);
        }

        // API로 이벤트 저장 (즉각 반영 로직 포함)
        function saveEvent() {
            const title = document.getElementById('ev-title').value;
            const start = document.getElementById('ev-start').value;
            const end = document.getElementById('ev-end').value;
            const btn = document.getElementById('btn-save');

            if(!title || !start || !end) {
                // 커스텀 스타일 오류 표시
                document.getElementById('ev-title').style.borderColor = '#e50914';
                setTimeout(() => document.getElementById('ev-title').style.borderColor = '#404040', 2000);
                return;
            }

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 저장 중...';
            btn.disabled = true;

            const payload = {
                action: 'addEvent',
                title: title,
                start: start,
                end: end,
                allDay: document.getElementById('ev-allday').checked,
                category: document.getElementById('ev-category').value,
                author: currentUser.name
            };

            fetch(GAS_API_URL, {
                method: 'POST',
                redirect: 'follow',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                if(res.success) {
                    closeModal('add-modal');
                    // 핵심: 저장이 완료되면 캘린더를 강제로 다시 불러와 즉각 화면에 반영합니다.
                    calendar.refetchEvents();
                } else {
                    alert("오류 발생: " + res.error);
                }
            })
            .catch(err => {
                alert("네트워크 통신 오류가 발생했습니다.");
            })
            .finally(() => {
                btn.innerHTML = '등록하기';
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
`
