<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetCalendar</title>

    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { netRed: '#e50914', netBg: '#141414', netCard: '#2a2a2a' }
                }
            }
        }
    </script>

    <style>
        body { background-color: #141414; color: #ffffff; font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #141414; }
        ::-webkit-scrollbar-thumb { background: #404040; border-radius: 4px; }

        /* ===== FullCalendar 다크 테마 ===== */
        :root {
            --fc-page-bg-color: #141414;
            --fc-border-color: #2f2f2f;
            --fc-neutral-bg-color: #1c1c1c;
            --fc-button-text-color: #ffffff;
            --fc-button-bg-color: #2f2f2f;
            --fc-button-border-color: #2f2f2f;
            --fc-button-hover-bg-color: #404040;
            --fc-button-hover-border-color: #404040;
            --fc-button-active-bg-color: #e50914;
            --fc-button-active-border-color: #e50914;
            --fc-today-bg-color: rgba(229, 9, 20, 0.18);
            --fc-now-indicator-color: #e50914;
            --fc-more-link-bg-color: transparent;
        }
        .fc .fc-toolbar.fc-header-toolbar { margin-bottom: 1rem; }
        .fc .fc-toolbar-title { font-size: 1.5rem; font-weight: 700; }
        .fc .fc-button { border-radius: 4px; font-weight: 600; text-transform: none; box-shadow: none !important; }
        .fc .fc-button-group > .fc-button { border-radius: 0; }
        .fc .fc-button-group > .fc-button:first-child { border-radius: 4px 0 0 4px; }
        .fc .fc-button-group > .fc-button:last-child { border-radius: 0 4px 4px 0; }
        .fc .fc-button-group > .fc-button:only-child { border-radius: 4px; }
        .fc .fc-button-primary:disabled { background-color: #2f2f2f; border-color: #2f2f2f; opacity: .7; }

        .fc-theme-standard td, .fc-theme-standard th { border-color: #2f2f2f; }
        .fc-theme-standard .fc-scrollgrid { border-color: #2f2f2f; }
        .fc .fc-col-header-cell-cushion { font-weight: 700; padding: 8px 4px; color: #fff; }
        .fc .fc-daygrid-day { cursor: pointer; }
        .fc .fc-daygrid-day-top { flex-direction: row; justify-content: flex-end; }
        .fc .fc-daygrid-day-number { padding: 8px 10px; font-weight: 600; color: #fff; }
        .fc .fc-day-other .fc-daygrid-day-number { color: #fff; opacity: .35; }

        /* 이벤트: 시간 있는 일정 = 점 + 시간 + 굵은 제목 / 종일·기간 일정 = 색 막대 */
        .fc .fc-event { cursor: pointer; border: none; }
        .fc .fc-daygrid-block-event { border-radius: 3px; padding: 1px 6px; }
        .fc .fc-daygrid-dot-event { padding: 2px 4px; }
        .fc .fc-daygrid-dot-event:hover { background: rgba(255,255,255,.08); }
        .fc .fc-daygrid-dot-event .fc-event-title { font-weight: 700; color: #fff; }
        .fc .fc-daygrid-dot-event .fc-event-time { font-weight: 500; color: #ddd; }
        .fc .fc-event-main { color: #fff; }
        .fc .fc-daygrid-event { font-size: .8rem; }
        .fc .fc-daygrid-more-link { color: #aaa; font-size: .75rem; padding: 0 4px; }
        .fc .fc-popover { background: #222; border-color: #333; }
        .fc .fc-popover-header { background: #2f2f2f; }
        .fc .fc-timegrid-slot-label-cushion, .fc .fc-timegrid-axis-cushion { color: #aaa; font-size: .75rem; }

        /* 모바일 전용: 날짜 아래 색 점 + 선택한 날짜 강조 */
        .nc-dots { display: flex; gap: 3px; justify-content: center; position: absolute; left: 0; right: 0; bottom: 5px; }
        .nc-dots span { width: 6px; height: 6px; border-radius: 50%; display: block; }
        .fc .fc-daygrid-day.nc-selected { box-shadow: inset 0 0 0 2px #e50914; }

        @media (max-width: 767px) {
            .fc .fc-toolbar.fc-header-toolbar { margin-bottom: .6rem; }
            .fc .fc-toolbar-title { font-size: 1.1rem; }
            .fc .fc-button { padding: .35rem .6rem; font-size: .8rem; }
            .fc .fc-col-header-cell-cushion { font-size: .75rem; padding: 4px 0; }
            .fc .fc-daygrid-day-frame { min-height: 54px; }
            .fc .fc-daygrid-day-top { justify-content: center; }
            .fc .fc-daygrid-day-number { padding: 5px 0; font-size: .85rem; }
        }

        /* 입력 / 모달 */
        .net-input { background-color: #333; border: 1px solid #404040; color: white; border-radius: 4px; padding: 0.75rem 1rem; width: 100%; outline: none; }
        .net-input:focus { border-color: #e50914; }
        .net-input::-webkit-calendar-picker-indicator { filter: invert(1); }
        .modal-overlay { backdrop-filter: blur(5px); background-color: rgba(0, 0, 0, 0.75); transition: opacity 0.3s ease; }
    </style>
</head>
<body>

    <!-- 1. 로그인 화면 -->
    <div id="login-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#141414] transition-opacity duration-500 px-4 text-center">
        <h1 class="text-4xl md:text-6xl font-black text-[#e50914] mb-2 tracking-tighter uppercase">NetCalendar</h1>
        <p class="text-gray-400 mb-10 text-base md:text-lg">팀 캘린더에 입장하려면 로그인하세요</p>
        <div id="g_id_onload"
             data-client_id="478451428995-2crtpdco8bt3mnm9vp19upqabeqbtj89.apps.googleusercontent.com"
             data-auto_select="true"
             data-callback="handleCredentialResponse">
        </div>
        <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-size="large"></div>
        <p id="login-error" class="text-red-400 text-sm mt-6 hidden"></p>
    </div>

    <!-- 2. 메인 앱 -->
    <div id="main-app" class="hidden flex-col h-[100dvh]">
        <header class="w-full bg-black h-14 px-4 md:px-6 flex justify-between items-center border-b border-[#2f2f2f] shrink-0">
            <div class="text-netRed font-black text-2xl tracking-tighter uppercase">NetCalendar</div>
            <div id="user-profile" class="relative"></div>
        </header>

        <!-- 모바일: 세로(캘린더 → 선택한 날 → 임박한 일정) / 데스크톱: 좌 70% · 우 30% -->
        <main class="flex-1 min-h-0 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden">
            <section class="w-full md:w-[70%] md:h-full p-3 md:p-5 md:overflow-hidden">
                <div id="calendar" class="w-full md:h-full"></div>
            </section>

            <aside class="w-full md:w-[30%] md:h-full bg-[#181818] md:border-l border-t md:border-t-0 border-[#2f2f2f] p-4 md:p-6 flex flex-col md:overflow-y-auto">
                <!-- 모바일 전용: 선택한 날짜의 일정 -->
                <div id="day-section" class="md:hidden mb-6">
                    <div class="flex items-center justify-between mb-3">
                        <h2 id="day-title" class="text-lg font-bold"></h2>
                        <span id="day-count" class="text-xs text-gray-400"></span>
                    </div>
                    <div id="day-list" class="space-y-3"></div>
                </div>

                <div class="flex items-center justify-between mb-4 shrink-0">
                    <h2 class="text-lg md:text-xl font-bold">임박한 일정</h2>
                    <i class="fa-regular fa-bell text-gray-300"></i>
                </div>
                <div id="upcoming-list" class="space-y-3 md:space-y-4 pb-24 md:pb-4">
                    <div class="text-gray-500 text-center py-10"><i class="fa-solid fa-spinner fa-spin mr-2"></i> 일정을 불러오는 중...</div>
                </div>
            </aside>
        </main>

        <!-- 모바일 전용 일정 추가 버튼 -->
        <button onclick="openAddModal(selectedDate)" aria-label="일정 추가"
                class="md:hidden fixed bottom-5 right-5 w-14 h-14 rounded-full bg-netRed hover:bg-[#b1060e] text-white text-2xl shadow-xl z-40 flex items-center justify-center">
            <i class="fa-solid fa-plus"></i>
        </button>
    </div>

    <!-- 3. 모달: 새 일정 등록 -->
    <div id="add-modal" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4 opacity-0">
        <div class="bg-[#181818] rounded-lg shadow-2xl w-full max-w-md border border-gray-700 overflow-hidden max-h-[95dvh] overflow-y-auto">
            <div class="p-5 border-b border-[#2f2f2f] flex justify-between items-center bg-[#222]">
                <h3 class="text-xl font-bold">새 일정 등록</h3>
                <button onclick="closeModal('add-modal')" class="text-gray-400 hover:text-white" aria-label="닫기"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-5 space-y-5">
                <input type="text" id="ev-title" maxlength="100" class="net-input text-lg font-bold" placeholder="일정 제목">

                <div class="flex gap-3">
                    <div class="flex-1 min-w-0">
                        <label class="block text-xs text-gray-400 mb-1">시작</label>
                        <input type="datetime-local" id="ev-start" class="net-input">
                    </div>
                    <div class="flex-1 min-w-0">
                        <label class="block text-xs text-gray-400 mb-1">종료</label>
                        <input type="datetime-local" id="ev-end" class="net-input">
                    </div>
                </div>

                <label class="flex items-center gap-2 cursor-pointer w-max">
                    <input type="checkbox" id="ev-allday" class="w-4 h-4 accent-netRed cursor-pointer" onchange="applyAllDayMode()">
                    <span class="text-sm">종일(All-Day) 일정</span>
                </label>

                <div class="flex gap-3">
                    <div class="flex-1 min-w-0">
                        <input type="text" id="ev-author" class="net-input bg-[#222] text-gray-400 cursor-not-allowed" readonly>
                    </div>
                    <div class="flex-1 min-w-0">
                        <select id="ev-category" class="net-input cursor-pointer">
                            <option value="회사 일정">🏢 회사 일정</option>
                            <option value="개인 일정">👤 개인 일정</option>
                            <option value="블로그 협찬">📝 블로그 협찬</option>
                        </select>
                    </div>
                </div>
                <p id="add-error" class="text-red-400 text-sm hidden"></p>
            </div>
            <div class="p-5 pt-0 flex gap-3">
                <button onclick="saveEvent()" id="btn-save" class="flex-1 bg-netRed hover:bg-[#b1060e] text-white font-bold py-3 rounded transition">등록하기</button>
                <button onclick="closeModal('add-modal')" class="flex-1 bg-transparent border border-gray-500 hover:border-white text-white font-bold py-3 rounded transition">취소</button>
            </div>
        </div>
    </div>

    <!-- 4. 모달: 일정 상세 -->
    <div id="details-modal" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4 opacity-0">
        <div class="bg-[#181818] rounded-lg shadow-2xl w-full max-w-sm overflow-hidden border border-gray-700">
            <div class="h-32 w-full relative bg-[#2f2f2f] flex flex-col justify-end p-5" id="detail-cover">
                <button onclick="closeModal('details-modal')" aria-label="닫기" class="absolute top-4 right-4 w-8 h-8 bg-black/50 rounded-full text-white hover:bg-white hover:text-black transition flex items-center justify-center z-20"><i class="fa-solid fa-xmark"></i></button>
                <div class="z-10 relative">
                    <span id="detail-badge" class="text-xs font-bold px-2 py-1 rounded bg-black/70 text-white mb-2 inline-block border border-white"></span>
                    <h3 id="detail-title" class="text-2xl font-bold text-white drop-shadow-md break-words"></h3>
                </div>
                <div class="absolute inset-0 bg-gradient-to-t from-[#181818] to-transparent"></div>
            </div>
            <div class="p-5 space-y-4">
                <div class="flex items-center gap-3">
                    <i class="fa-regular fa-clock text-netRed w-5 text-center"></i>
                    <p id="detail-time" class="font-medium text-white"></p>
                </div>
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-user text-netRed w-5 text-center"></i>
                    <p id="detail-author" class="font-medium text-white"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== 설정 =====
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyEp13vz9Ey2JtP_iuNqoeZPnAySDUFiy3OT3Afu3YEz-i4knIXYRYQn4hnRF7wEr4g/exec";
        const CRED_KEY = 'nc_credential';

        // 카테고리별 색상/짧은 이름 (서버 수정 없이 여기서만 바꾸면 됩니다)
        const CATEGORY_STYLE = {
            '회사 일정':   { color: '#2d7ff9', short: '회사' },
            '개인 일정':   { color: '#22c55e', short: '개인' },
            '블로그 협찬': { color: '#9b59b6', short: '블로그' }
        };
        const styleOf = cat => CATEGORY_STYLE[cat] || { color: '#808080', short: cat || '기타' };

        let currentUser = null;
        let idToken = null;
        let calendar = null;
        let upcomingEvents = [];
        let dayEvents = [];
        let appStarted = false;
        let selectedDate = null; // 모바일에서 선택한 날짜 'YYYY-MM-DD'

        const mq = window.matchMedia('(max-width: 767px)');
        const isMobile = () => mq.matches;

        // ===== 유틸 =====
        const pad = n => String(n).padStart(2, '0');
        const toDateStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        const toLocalInput = d => `${toDateStr(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        const startOfDay = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
        selectedDate = toDateStr(new Date());

        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function parseLocal(str) {
            if (!str) return null;
            if (/^\d{4}-\d{2}-\d{2}$/.test(str)) {
                const [y, m, d] = str.split('-').map(Number);
                return new Date(y, m - 1, d);
            }
            return new Date(str);
        }

        function decodeJwt(token) {
            const base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
            return JSON.parse(decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
        }

        // ===== API =====
        async function api(action, payload = {}) {
            const res = await fetch(GAS_API_URL, {
                method: 'POST',
                redirect: 'follow',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action, idToken, ...payload })
            });
            const json = await res.json();
            if (!json.success) {
                if ((json.error || '').startsWith('AUTH')) logout(json.error);
                throw new Error(json.error || '요청 실패');
            }
            return json;
        }

        // ===== 로그인 / 세션 =====
        function startSession(credential) {
            let user;
            try { user = decodeJwt(credential); } catch (e) { return false; }
            if (!user.exp || user.exp * 1000 < Date.now()) return false;
            currentUser = user;
            idToken = credential;
            localStorage.setItem(CRED_KEY, credential);
            if (!appStarted) enterApp();
            return true;
        }

        function handleCredentialResponse(response) { startSession(response.credential); }

        function logout(message) {
            localStorage.removeItem(CRED_KEY);
            if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
            if (message) sessionStorage.setItem('nc_login_msg', message.replace(/^AUTH:\s*/, ''));
            location.reload();
        }

        function enterApp() {
            appStarted = true;
            const loginScreen = document.getElementById('login-screen');
            loginScreen.classList.add('opacity-0');
            setTimeout(() => loginScreen.classList.add('hidden'), 500);

            const main = document.getElementById('main-app');
            main.classList.remove('hidden');
            main.classList.add('flex');

            document.getElementById('user-profile').innerHTML = `
                <button id="profile-btn" class="w-8 h-8 rounded-md bg-[#3a3f4b] overflow-hidden flex items-center justify-center text-gray-200" aria-label="내 계정">
                    ${currentUser.picture
                        ? `<img src="${escapeHtml(currentUser.picture)}" class="w-full h-full object-cover" referrerpolicy="no-referrer" alt="">`
                        : '<i class="fa-solid fa-user"></i>'}
                </button>
                <div id="profile-menu" class="hidden absolute right-0 mt-2 w-56 bg-[#222] border border-[#333] rounded-lg shadow-xl p-3 z-50">
                    <p class="font-bold text-sm truncate">${escapeHtml(currentUser.name)}</p>
                    <p class="text-xs text-gray-400 truncate mb-3">${escapeHtml(currentUser.email || '')}</p>
                    <button onclick="logout()" class="w-full text-sm border border-gray-600 hover:border-white rounded py-2 transition">로그아웃</button>
                </div>`;
            document.getElementById('profile-btn').addEventListener('click', e => {
                e.stopPropagation();
                document.getElementById('profile-menu').classList.toggle('hidden');
            });

            initCalendar();
            loadUpcoming();
        }

        window.addEventListener('DOMContentLoaded', () => {
            const msg = sessionStorage.getItem('nc_login_msg');
            if (msg) {
                const el = document.getElementById('login-error');
                el.textContent = msg;
                el.classList.remove('hidden');
                sessionStorage.removeItem('nc_login_msg');
            }
            const saved = localStorage.getItem(CRED_KEY);
            if (saved && !startSession(saved)) localStorage.removeItem(CRED_KEY);
        });

        // ===== 캘린더 =====
        const TOOLBAR_DESKTOP = { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,timeGridDay' };
        const TOOLBAR_MOBILE = { left: 'prev,next', center: 'title', right: 'today' };

        function applyStyle(ev) {
            const st = styleOf(ev.extendedProps && ev.extendedProps.category);
            return { ...ev, backgroundColor: st.color, borderColor: st.color };
        }

        function initCalendar() {
            const m = isMobile();
            calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
                initialView: 'dayGridMonth',
                locale: 'ko',
                height: m ? 'auto' : '100%',
                fixedWeekCount: !m,
                dayMaxEvents: !m,
                eventDisplay: m ? 'none' : 'auto',
                nowIndicator: true,
                scrollTime: '08:00:00',
                headerToolbar: m ? TOOLBAR_MOBILE : TOOLBAR_DESKTOP,
                buttonText: { today: 'Today', month: 'Month', week: 'Week', day: 'Day' },
                allDayText: '종일',
                moreLinkText: n => `+${n}개`,
                eventTimeFormat: { hour: 'numeric', minute: '2-digit', omitZeroMinute: true, meridiem: 'short' },

                dateClick: info => {
                    if (isMobile()) {
                        // 모바일: 탭 → 그 날짜의 일정 보기 (추가는 + 버튼)
                        selectedDate = info.dateStr.slice(0, 10);
                        highlightSelected();
                        renderDayAgenda();
                    } else {
                        openAddModal(info.dateStr, info.allDay);
                    }
                },
                eventClick: info => {
                    info.jsEvent.preventDefault();
                    openDetailsModal(fcToView(info.event));
                },
                datesSet: info => {
                    if (!isMobile()) return;
                    const cs = info.view.currentStart, ce = info.view.currentEnd;
                    const sel = parseLocal(selectedDate);
                    if (sel < cs || sel >= ce) {
                        const t = new Date();
                        selectedDate = (t >= cs && t < ce) ? toDateStr(t) : toDateStr(cs);
                    }
                    highlightSelected();
                    renderDayAgenda();
                },
                eventsSet: () => { renderMobileDots(); renderDayAgenda(); },
                events: (info, success, failure) => {
                    api('getEvents', { start: info.startStr, end: info.endStr })
                        .then(r => success(r.events.map(applyStyle)))
                        .catch(err => { console.error(err); failure(err); });
                }
            });
            calendar.render();
        }

        // 화면 크기가 바뀌면(회전 등) 레이아웃 재적용
        mq.addEventListener('change', () => {
            if (!calendar) return;
            const m = isMobile();
            calendar.setOption('headerToolbar', m ? TOOLBAR_MOBILE : TOOLBAR_DESKTOP);
            calendar.setOption('eventDisplay', m ? 'none' : 'auto');
            calendar.setOption('height', m ? 'auto' : '100%');
            calendar.setOption('fixedWeekCount', !m);
            calendar.setOption('dayMaxEvents', !m);
            if (m && calendar.view.type !== 'dayGridMonth') calendar.changeView('dayGridMonth');
            renderMobileDots();
            highlightSelected();
            renderDayAgenda();
        });

        // 모바일: 날짜 칸 아래에 일정 색 점 표시
        function renderMobileDots() {
            document.querySelectorAll('.nc-dots').forEach(n => n.remove());
            if (!isMobile() || !calendar) return;
            const map = {};
            calendar.getEvents().forEach(ev => {
                if (!ev.start) return;
                const color = styleOf(ev.extendedProps.category).color;
                const end = ev.end || ev.start;
                let d = startOfDay(ev.start);
                do {
                    (map[toDateStr(d)] = map[toDateStr(d)] || []).push(color);
                    d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
                } while (d < end);
            });
            Object.entries(map).forEach(([date, colors]) => {
                const frame = document.querySelector(`.fc-daygrid-day[data-date="${date}"] .fc-daygrid-day-frame`);
                if (!frame) return;
                const box = document.createElement('div');
                box.className = 'nc-dots';
                colors.slice(0, 4).forEach(c => {
                    const s = document.createElement('span');
                    s.style.background = c;
                    box.appendChild(s);
                });
                frame.appendChild(box);
            });
            highlightSelected();
        }

        function highlightSelected() {
            document.querySelectorAll('.nc-selected').forEach(n => n.classList.remove('nc-selected'));
            if (!isMobile()) return;
            const td = document.querySelector(`.fc-daygrid-day[data-date="${selectedDate}"]`);
            if (td) td.classList.add('nc-selected');
        }

        // ===== 데이터 변환 =====
        function normalize(ev) {
            const props = ev.extendedProps || {};
            const start = ev.start instanceof Date ? ev.start : parseLocal(ev.start);
            let end = ev.end instanceof Date ? ev.end : parseLocal(ev.end);
            if (!end) end = start;
            const category = props.category || '기타';
            return {
                title: ev.title,
                allDay: !!ev.allDay,
                start, end,
                color: styleOf(category).color,
                category,
                author: props.author || '익명'
            };
        }
        const fcToView = ev => normalize({ title: ev.title, allDay: ev.allDay, start: ev.start, end: ev.end, extendedProps: ev.extendedProps });

        // ===== 카드 UI (임박한 일정 / 선택한 날짜 공용) =====
        function badgeHtml(text, red) {
            const cls = red ? 'bg-netRed text-white' : 'bg-[#2d3340] text-gray-300';
            return `<span class="text-xs font-bold px-2 py-1 rounded ${cls}">${escapeHtml(text)}</span>`;
        }

        function cardHtml(ev, cls, idx, badge, rightText) {
            const st = styleOf(ev.category);
            return `
                <div class="${cls} bg-[#2a2a2a] hover:bg-[#333] rounded-md p-4 border-l-4 cursor-pointer transition shadow-md"
                     style="border-left-color: ${st.color}" data-index="${idx}">
                    <div class="flex justify-between items-center mb-2">
                        ${badge}
                        <span class="text-xs text-gray-400">${escapeHtml(rightText)}</span>
                    </div>
                    <h4 class="font-bold text-lg text-white mb-2 truncate">${escapeHtml(ev.title)}</h4>
                    <div class="flex items-center gap-4 text-sm text-gray-400">
                        <span class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full" style="background-color: ${st.color}"></span>${escapeHtml(st.short)}</span>
                        <span class="flex items-center gap-1"><i class="fa-solid fa-user text-xs"></i>${escapeHtml(ev.author)}</span>
                    </div>
                </div>`;
        }

        // ===== 임박한 일정 (오늘~90일) =====
        async function loadUpcoming() {
            const list = document.getElementById('upcoming-list');
            try {
                const from = startOfDay(new Date());
                const to = new Date(from); to.setDate(to.getDate() + 90);
                const r = await api('getEvents', { start: from.toISOString(), end: to.toISOString() });
                const now = new Date();
                upcomingEvents = r.events.map(normalize)
                    .filter(e => e.end > now)
                    .sort((a, b) => a.start - b.start);
                renderUpcoming();
            } catch (err) {
                list.innerHTML = `<div class="text-red-400 text-center py-10 bg-[#222] rounded-lg border border-[#333]">일정을 불러오지 못했습니다.<br><span class="text-xs text-gray-500">${escapeHtml(err.message)}</span></div>`;
            }
        }

        function renderUpcoming() {
            const list = document.getElementById('upcoming-list');
            if (!upcomingEvents.length) {
                list.innerHTML = '<div class="text-gray-500 text-center py-10 bg-[#222] rounded-lg border border-[#333]">예정된 일정이 없습니다.</div>';
                return;
            }
            const today = startOfDay(new Date());
            list.innerHTML = upcomingEvents.map((ev, i) => {
                const diff = Math.round((startOfDay(ev.start) - today) / 86400000);
                const text = diff < 0 ? '진행중' : (diff === 0 ? 'D-Day' : `D-${diff}`);
                const dateText = ev.start.toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric', weekday: 'short' });
                return cardHtml(ev, 'upcoming-item', i, badgeHtml(text, diff <= 3), dateText);
            }).join('');
        }

        // ===== 모바일: 선택한 날짜의 일정 =====
        function renderDayAgenda() {
            if (!calendar || !isMobile()) return;
            const day = parseLocal(selectedDate);
            const next = new Date(day.getFullYear(), day.getMonth(), day.getDate() + 1);

            dayEvents = calendar.getEvents().filter(ev => {
                if (!ev.start) return false;
                const s = ev.start, e = ev.end || ev.start;
                return s < next && (e > day || (e.getTime() === s.getTime() && s >= day));
            }).map(fcToView).sort((a, b) => a.start - b.start);

            const todayStr = toDateStr(new Date());
            document.getElementById('day-title').textContent =
                day.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' }) + (selectedDate === todayStr ? ' · 오늘' : '');
            document.getElementById('day-count').textContent = dayEvents.length ? `${dayEvents.length}개의 일정` : '';

            const list = document.getElementById('day-list');
            if (!dayEvents.length) {
                list.innerHTML = '<div class="text-gray-500 text-center py-6 bg-[#222] rounded-lg border border-[#333] text-sm">일정이 없습니다. 오른쪽 아래 + 버튼으로 추가하세요.</div>';
                return;
            }
            list.innerHTML = dayEvents.map((ev, i) => {
                const label = ev.allDay ? '종일' : ev.start.toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });
                return cardHtml(ev, 'agenda-item', i, badgeHtml(label, false), '');
            }).join('');
        }

        // ===== 클릭 처리 =====
        document.addEventListener('click', e => {
            const up = e.target.closest('.upcoming-item');
            if (up) return openDetailsModal(upcomingEvents[Number(up.dataset.index)]);
            const ag = e.target.closest('.agenda-item');
            if (ag) return openDetailsModal(dayEvents[Number(ag.dataset.index)]);
            const menu = document.getElementById('profile-menu');
            if (menu && !e.target.closest('#profile-menu')) menu.classList.add('hidden');
        });

        // ===== 모달 =====
        function openModal(id) {
            const m = document.getElementById(id);
            m.classList.remove('hidden');
            setTimeout(() => m.classList.remove('opacity-0'), 10);
        }

        function closeModal(id) {
            const m = document.getElementById(id);
            m.classList.add('opacity-0');
            setTimeout(() => {
                m.classList.add('hidden');
                if (id === 'add-modal') {
                    document.getElementById('ev-title').value = '';
                    document.getElementById('add-error').classList.add('hidden');
                }
            }, 300);
        }

        ['add-modal', 'details-modal'].forEach(id => {
            document.getElementById(id).addEventListener('click', e => { if (e.target.id === id) closeModal(id); });
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') ['add-modal', 'details-modal'].forEach(id => {
                if (!document.getElementById(id).classList.contains('hidden')) closeModal(id);
            });
        });

        function applyAllDayMode() {
            const allDay = document.getElementById('ev-allday').checked;
            const s = document.getElementById('ev-start');
            const e = document.getElementById('ev-end');
            const sd = (s.value || '').slice(0, 10);
            const ed = (e.value || '').slice(0, 10) || sd;
            s.type = e.type = allDay ? 'date' : 'datetime-local';
            s.value = allDay ? sd : `${sd}T09:00`;
            e.value = allDay ? ed : `${ed}T10:00`;
        }

        // dateStr: 'YYYY-MM-DD' 또는 시간 포함 문자열(주/일 보기에서 시간 칸 클릭)
        function openAddModal(dateStr, allDay = true) {
            const s = document.getElementById('ev-start');
            const e = document.getElementById('ev-end');
            document.getElementById('ev-allday').checked = allDay;
            s.type = e.type = allDay ? 'date' : 'datetime-local';
            if (allDay) {
                const day = (dateStr || toDateStr(new Date())).slice(0, 10);
                s.value = e.value = day;
            } else {
                const start = new Date(dateStr);
                s.value = toLocalInput(start);
                e.value = toLocalInput(new Date(start.getTime() + 3600000));
            }
            document.getElementById('ev-author').value = currentUser.name;
            openModal('add-modal');
        }

        function openDetailsModal(ev) {
            if (!ev) return;
            document.getElementById('detail-title').textContent = ev.title;
            document.getElementById('detail-author').textContent = ev.author;
            document.getElementById('detail-badge').textContent = ev.category;
            document.getElementById('detail-cover').style.backgroundColor = ev.color;

            const dOpt = { month: 'short', day: 'numeric', weekday: 'short' };
            const tOpt = { hour: '2-digit', minute: '2-digit' };
            let text;
            if (ev.allDay) {
                const last = new Date(ev.end); last.setDate(last.getDate() - 1);
                text = toDateStr(last) <= toDateStr(ev.start)
                    ? `${ev.start.toLocaleDateString('ko-KR', dOpt)} · 종일`
                    : `${ev.start.toLocaleDateString('ko-KR', dOpt)} ~ ${last.toLocaleDateString('ko-KR', dOpt)} · 종일`;
            } else {
                const sameDay = toDateStr(ev.start) === toDateStr(ev.end);
                text = `${ev.start.toLocaleDateString('ko-KR', dOpt)} ${ev.start.toLocaleTimeString('ko-KR', tOpt)} ~ ` +
                       (sameDay ? '' : ev.end.toLocaleDateString('ko-KR', dOpt) + ' ') + ev.end.toLocaleTimeString('ko-KR', tOpt);
            }
            document.getElementById('detail-time').textContent = text;
            openModal('details-modal');
        }

        // ===== 저장 =====
        async function saveEvent() {
            const titleEl = document.getElementById('ev-title');
            const errEl = document.getElementById('add-error');
            const btn = document.getElementById('btn-save');
            const title = titleEl.value.trim();
            const startVal = document.getElementById('ev-start').value;
            const endVal = document.getElementById('ev-end').value;
            const allDay = document.getElementById('ev-allday').checked;

            const showError = msg => { errEl.textContent = msg; errEl.classList.remove('hidden'); };
            errEl.classList.add('hidden');

            if (!title) { titleEl.style.borderColor = '#e50914'; setTimeout(() => titleEl.style.borderColor = '#404040', 2000); return showError('제목을 입력하세요.'); }
            if (!startVal || !endVal) return showError('시작/종료 시간을 입력하세요.');

            let start, end;
            if (allDay) {
                if (endVal < startVal) return showError('종료일이 시작일보다 빠릅니다.');
                start = startVal; end = endVal;
            } else {
                const s = new Date(startVal), e = new Date(endVal);
                if (e <= s) return showError('종료 시간이 시작 시간보다 늦어야 합니다.');
                start = s.toISOString(); end = e.toISOString();
            }

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 저장 중...';
            btn.disabled = true;
            try {
                await api('addEvent', { title, start, end, allDay, category: document.getElementById('ev-category').value });
                closeModal('add-modal');
                calendar.refetchEvents();
                loadUpcoming();
            } catch (err) {
                showError('오류: ' + err.message);
            } finally {
                btn.innerHTML = '등록하기';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
