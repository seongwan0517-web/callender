<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f11">
    <title>Time Schedule</title>

    <!-- 앱 설치 (안드로이드: 앱 설치 / 아이폰: 공유 → 홈 화면에 추가) -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Time Schedule">

    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Pretendard Variable"', 'Pretendard', 'sans-serif'] },
                    colors: { netRed: '#e50914' }
                }
            }
        }
    </script>

    <style>
        /* ===== 디자인 토큰 ===== */
        :root {
            --bg: #0f0f11;
            --surface: #18181b;
            --surface-2: #222226;
            --surface-3: #2c2c31;
            --line: #2e2e33;
            --text: #f4f4f5;
            --muted: #a1a1aa;
            --faint: #71717a;
            --brand: #e50914;
            --brand-dark: #b8070f;
            --blog: #9b59b6;
            --tabbar-h: 64px;
        }
        * { -webkit-tap-highlight-color: transparent; }
        html, body { background: var(--bg); color: var(--text); }
        /* 아이폰 홈 화면 앱: 상단 상태바(시계·배터리) 아래로 내용 내리기 */
        #main-app { padding-top: env(safe-area-inset-top); }
        body { font-family: "Pretendard Variable", Pretendard, sans-serif; letter-spacing: -0.01em; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3a3a40; border-radius: 4px; }

        /* ===== 공통 컴포넌트 ===== */
        .btn-primary { background: var(--brand); color: #fff; font-weight: 700; border-radius: 10px; transition: background .15s; }
        .btn-primary:hover { background: var(--brand-dark); }
        .btn-ghost { border: 1px solid #3f3f46; color: var(--text); font-weight: 700; border-radius: 10px; transition: border-color .15s; }
        .btn-ghost:hover { border-color: #fff; }

        .chip-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
        .chip-row::-webkit-scrollbar { display: none; }
        .chip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px;
                background: var(--surface-2); color: var(--muted); font-size: 13px; font-weight: 600; border: 1px solid var(--line); transition: all .15s; }
        .chip:hover { color: var(--text); }
        .chip.active { background: var(--text); color: #111; border-color: var(--text); }
        .chip .dot { width: 8px; height: 8px; border-radius: 50%; }

        .tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; }

        /* 일정 카드 */
        .ev-card { position: relative; display: flex; gap: 12px; align-items: stretch; background: var(--surface-2); border-radius: 14px;
                   padding: 14px 14px 14px 18px; cursor: pointer; transition: background .15s; overflow: hidden; }
        .ev-card:hover { background: var(--surface-3); }
        .ev-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c, #808080); }
        .ev-title { font-size: 16px; font-weight: 700; line-height: 1.35; word-break: keep-all; overflow-wrap: anywhere; }
        .ev-meta { font-size: 13px; color: var(--muted); }
        .ev-time { font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; }

        .group-head { display: flex; align-items: center; justify-content: space-between; margin: 18px 2px 8px; }
        .group-head:first-child { margin-top: 0; }
        .group-date { font-size: 14px; font-weight: 700; color: var(--text); }
        .group-date small { color: var(--faint); font-weight: 600; margin-left: 6px; }
        .dday { font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: var(--surface-3); color: var(--muted); }
        .dday.hot { background: var(--brand); color: #fff; }

        .empty { color: var(--faint); text-align: center; padding: 36px 12px; background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; font-size: 14px; }

        /* 입력 */
        .net-input { background: var(--surface-2); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: .75rem 1rem; width: 100%; outline: none; font-size: 15px; }
        .net-input:focus { border-color: var(--brand); }
        .net-input::-webkit-calendar-picker-indicator { filter: invert(1); }
        textarea.net-input { resize: vertical; }
        .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 12px; }
        .seg button { padding: 10px 4px; border-radius: 9px; font-size: 14px; font-weight: 700; color: var(--muted); transition: all .15s; }
        .seg button.active { background: var(--surface-3); color: var(--text); box-shadow: inset 0 0 0 1px #4a4a52; }
        .seg button.active[data-v="블로그 협찬"] { background: rgba(155, 89, 182, .22); box-shadow: inset 0 0 0 1px var(--blog); }
        .label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
        .opt { padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 700; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); transition: all .15s; }
        .opt:hover { color: var(--text); }
        .opt.on { background: rgba(155, 89, 182, .25); color: #fff; border-color: var(--blog); }
        .opt.add { border-style: dashed; }
        .opt-input { display: inline-flex; gap: 6px; }
        .opt-input input { width: 130px; background: var(--surface-2); border: 1px solid var(--blog); color: var(--text); border-radius: 999px; padding: 7px 12px; font-size: 14px; outline: none; }
        .money-row { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; }
        .money-row:focus-within { border-color: var(--blog); }
        .money-row span { flex: none; width: 118px; font-size: 13px; color: var(--muted); font-weight: 600; }
        .money-row em { font-style: normal; font-size: 13px; color: var(--faint); }
        .money-input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: var(--text); text-align: right; font-size: 16px; font-weight: 700; padding: 12px 0; }

        /* 모달 (PC: 가운데 / 모바일: 바텀시트) */
        .modal-overlay { backdrop-filter: blur(4px); background-color: rgba(0, 0, 0, .65); transition: opacity .25s ease; }
        .sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; transition: transform .25s ease; }
        .sheet-handle { display: none; }

        /* ===== FullCalendar ===== */
        :root {
            --fc-page-bg-color: transparent;
            --fc-border-color: var(--line);
            --fc-neutral-bg-color: var(--surface-2);
            --fc-button-text-color: #fff;
            --fc-button-bg-color: var(--surface-2);
            --fc-button-border-color: var(--line);
            --fc-button-hover-bg-color: var(--surface-3);
            --fc-button-hover-border-color: var(--surface-3);
            --fc-button-active-bg-color: var(--brand);
            --fc-button-active-border-color: var(--brand);
            --fc-today-bg-color: rgba(229, 9, 20, .10);
            --fc-now-indicator-color: var(--brand);
            --fc-more-link-bg-color: transparent;
        }
        .fc .fc-toolbar.fc-header-toolbar { margin-bottom: 1rem; }
        .fc .fc-toolbar-title { font-size: 1.45rem; font-weight: 800; }
        .fc .fc-button { border-radius: 9px; font-weight: 700; box-shadow: none !important; padding: .45rem .8rem; }
        .fc .fc-button-group > .fc-button { border-radius: 0; }
        .fc .fc-button-group > .fc-button:first-child { border-radius: 9px 0 0 9px; }
        .fc .fc-button-group > .fc-button:last-child { border-radius: 0 9px 9px 0; }
        .fc .fc-button-primary:disabled { opacity: .55; }
        .fc-theme-standard .fc-scrollgrid { border-radius: 14px; overflow: hidden; }
        .fc .fc-col-header-cell { background: var(--surface); }
        .fc .fc-col-header-cell-cushion { font-weight: 700; padding: 9px 4px; color: var(--muted); font-size: 13px; }
        .fc .fc-col-header-cell.fc-day-sun .fc-col-header-cell-cushion, .fc .fc-day-sun .fc-daygrid-day-number { color: #f87171; }
        .fc .fc-col-header-cell.fc-day-sat .fc-col-header-cell-cushion, .fc .fc-day-sat .fc-daygrid-day-number { color: #60a5fa; }
        .fc .fc-daygrid-day { cursor: pointer; }
        .fc .fc-daygrid-day-top { flex-direction: row; justify-content: flex-start; }
        .fc .fc-daygrid-day-number { padding: 7px 9px; font-weight: 700; color: var(--text); font-size: 14px; }
        .fc .fc-day-other .fc-daygrid-day-number { opacity: .3; }
        .fc .fc-day-today .fc-daygrid-day-number { background: var(--brand); color: #fff !important; border-radius: 999px; min-width: 26px; text-align: center; margin: 4px; padding: 3px 7px; }
        .fc .fc-event { cursor: pointer; border: none; }
        .fc .fc-daygrid-block-event { border-radius: 6px; padding: 2px 7px; }
        .fc .fc-daygrid-event { font-size: 13px; font-weight: 600; margin-top: 2px; }
        .fc .fc-daygrid-dot-event { padding: 2px 4px; border-radius: 6px; }
        .fc .fc-daygrid-dot-event:hover { background: rgba(255, 255, 255, .06); }
        .fc .fc-daygrid-dot-event .fc-event-title { font-weight: 700; color: var(--text); }
        .fc .fc-daygrid-dot-event .fc-event-time { font-weight: 500; color: var(--muted); }
        .fc .fc-daygrid-more-link { color: var(--muted); font-size: 12px; font-weight: 700; padding: 0 6px; }
        .fc .fc-popover { background: var(--surface); border-color: var(--line); border-radius: 12px; overflow: hidden; }
        .fc .fc-popover-header { background: var(--surface-2); padding: 8px 10px; }
        .fc .fc-timegrid-slot-label-cushion, .fc .fc-timegrid-axis-cushion { color: var(--muted); font-size: 12px; }

        /* 모바일 달력: 날짜 아래 색 점 + 선택한 날짜 */
        .nc-dots { display: flex; gap: 3px; justify-content: center; position: absolute; left: 0; right: 0; bottom: 6px; }
        .nc-dots span { width: 6px; height: 6px; border-radius: 50%; display: block; }
        .fc .fc-daygrid-day.nc-selected .fc-daygrid-day-frame { box-shadow: inset 0 0 0 2px var(--text); border-radius: 10px; }

        /* ===== 레이아웃: PC ===== */
        @media (min-width: 768px) {
            .mobile-only { display: none !important; }
            .app-main { flex: 1; min-height: 0; display: flex; overflow: hidden; }
            #panel-calendar { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 20px 24px; }
            #calendar { flex: 1; min-height: 0; }
            .side { width: 340px; flex: none; border-left: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
            .side .panel { display: none; flex: 1; min-height: 0; overflow-y: auto; padding: 20px; }
            body[data-side="home"] #panel-home, body[data-side="stats"] #panel-stats { display: block; }
            #panel-me { display: none; }
        }
        @media (min-width: 1280px) {
            .side { width: 400px; }
        }

        /* ===== 레이아웃: 모바일 ===== */
        @media (max-width: 767px) {
            .desk-only { display: none !important; }
            .app-main { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: calc(var(--tabbar-h) + 24px + env(safe-area-inset-bottom)); }
            .side { display: contents; }
            .panel { display: none; padding: 16px; }
            body[data-tab="home"] #panel-home,
            body[data-tab="calendar"] #panel-calendar,
            body[data-tab="stats"] #panel-stats,
            body[data-tab="me"] #panel-me { display: block; }

            .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
                      padding-bottom: env(safe-area-inset-bottom); background: rgba(24, 24, 27, .96); backdrop-filter: blur(10px);
                      border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); }
            .tabbar button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--faint); font-size: 11px; font-weight: 700; }
            .tabbar button i { font-size: 19px; }
            .tabbar button.active { color: var(--text); }
            .tabbar button.active i { color: var(--brand); }
            .fab { position: fixed; right: 18px; bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom)); z-index: 41; }
            body[data-tab="me"] .fab, body[data-tab="stats"] .fab { display: none; }

            .fc .fc-toolbar.fc-header-toolbar { margin-bottom: .7rem; }
            .fc .fc-toolbar-title { font-size: 1.2rem; }
            .fc .fc-button { padding: .4rem .65rem; font-size: .85rem; }
            .fc .fc-col-header-cell-cushion { font-size: 12px; padding: 6px 0; }
            .fc .fc-daygrid-day-frame { min-height: 58px; }
            .fc .fc-daygrid-day-top { justify-content: center; }
            .fc .fc-daygrid-day-number { padding: 6px 0; font-size: 14px; }
            .fc .fc-day-today .fc-daygrid-day-number { margin: 4px auto 0; }

            .modal-overlay { align-items: flex-end !important; padding: 0 !important; }
            .sheet { max-width: none !important; width: 100%; border-radius: 22px 22px 0 0; border-bottom: none; max-height: 92dvh !important;
                     padding-bottom: env(safe-area-inset-bottom); transform: translateY(30px); }
            .modal-overlay:not(.opacity-0) .sheet { transform: none; }
            .sheet-handle { display: block; width: 40px; height: 5px; border-radius: 3px; background: #4a4a52; margin: 10px auto 0; }
        }
    </style>
</head>
<body data-tab="home" data-side="home">

    <!-- 1. 로그인 화면 -->
    <div id="login-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center transition-opacity duration-500 px-6 text-center" style="background: var(--bg)">
        <div class="w-16 h-16 rounded-2xl bg-netRed flex items-center justify-center mb-6 shadow-lg shadow-red-900/40">
            <i class="fa-regular fa-calendar-check text-3xl text-white"></i>
        </div>
        <h1 class="text-4xl md:text-6xl font-black text-netRed mb-3 tracking-tight">Time Schedule</h1>
        <p class="text-gray-400 mb-10 text-base md:text-lg">팀 캘린더에 입장하려면 로그인하세요</p>
        <button id="login-btn" onclick="login()"
                class="flex items-center gap-3 bg-white hover:bg-gray-200 text-[#1f1f1f] font-bold px-7 py-3.5 rounded-xl shadow-lg transition disabled:opacity-60">
            <i class="fa-brands fa-google text-lg"></i>
            <span>Google 계정으로 로그인</span>
        </button>
        <p class="text-xs text-gray-500 mt-5">관리자가 등록한 계정만 들어올 수 있어요</p>
        <p id="login-error" class="text-red-400 text-sm mt-4 hidden"></p>
    </div>

    <!-- 2. 메인 앱 -->
    <div id="main-app" class="hidden flex-col h-[100dvh]">
        <header class="shrink-0 h-14 md:h-16 px-4 md:px-6 flex items-center gap-4 border-b" style="border-color: var(--line); background: var(--bg)">
            <div class="flex items-center gap-2 shrink-0">
                <span class="w-8 h-8 rounded-lg bg-netRed flex items-center justify-center"><i class="fa-regular fa-calendar-check text-white text-sm"></i></span>
                <span class="font-black text-lg md:text-xl tracking-tight">Time Schedule</span>
            </div>
            <div class="desk-only flex-1 min-w-0 flex items-center justify-center">
                <div class="chip-row filter-chips"></div>
            </div>
            <div class="flex items-center gap-3 ml-auto md:ml-0">
                <button onclick="openAddModal(selectedDate)" class="desk-only btn-primary px-4 py-2.5 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> 새 일정
                </button>
                <div id="user-profile" class="relative"></div>
            </div>
        </header>

        <main class="app-main">
            <!-- 캘린더 -->
            <section id="panel-calendar" class="panel">
                <div class="mobile-only chip-row filter-chips mb-3"></div>
                <div id="legend" class="flex flex-wrap gap-x-4 gap-y-1.5 text-[13px] text-gray-300 mb-3 shrink-0"></div>
                <div id="calendar"></div>

                <!-- 모바일: 선택한 날짜의 일정 -->
                <div id="day-section" class="mobile-only mt-5">
                    <div class="flex items-center justify-between mb-3">
                        <h2 id="day-title" class="text-lg font-bold"></h2>
                        <span id="day-count" class="text-sm text-gray-400"></span>
                    </div>
                    <div id="day-list" class="space-y-2.5"></div>
                </div>
            </section>

            <aside class="side">
                <div class="desk-only shrink-0 px-5 pt-5">
                    <div class="seg" style="grid-template-columns: repeat(2, 1fr)">
                        <button data-side-btn="home" onclick="setSide('home')">임박한 일정</button>
                        <button data-side-btn="stats" onclick="setSide('stats')">일정 분석</button>
                    </div>
                </div>

                <!-- 홈 / 임박한 일정 -->
                <section id="panel-home" class="panel">
                    <div class="mobile-only mb-5">
                        <p id="hero-date" class="text-sm text-gray-400 font-semibold"></p>
                        <h2 id="hero-hello" class="text-2xl font-extrabold mt-1"></h2>
                        <div id="hero-stats" class="grid grid-cols-3 gap-2.5 mt-4"></div>
                    </div>
                    <div class="mobile-only chip-row filter-chips mb-4"></div>
                    <h3 class="mobile-only text-base font-bold mb-3">다가오는 일정</h3>
                    <div id="upcoming-list">
                        <div class="empty"><i class="fa-solid fa-spinner fa-spin mr-2"></i> 일정을 불러오는 중...</div>
                    </div>
                </section>

                <!-- 통계 -->
                <section id="panel-stats" class="panel">
                    <div id="dashboard"></div>
                </section>
            </aside>

            <!-- 모바일: 내 정보 -->
            <section id="panel-me" class="panel">
                <div id="me-box"></div>
            </section>
        </main>

        <nav class="tabbar mobile-only">
            <button data-tab-btn="home" onclick="setTab('home')"><i class="fa-solid fa-house"></i>홈</button>
            <button data-tab-btn="calendar" onclick="setTab('calendar')"><i class="fa-regular fa-calendar"></i>캘린더</button>
            <button data-tab-btn="stats" onclick="setTab('stats')"><i class="fa-solid fa-chart-simple"></i>통계</button>
            <button data-tab-btn="me" onclick="setTab('me')"><i class="fa-regular fa-user"></i>내 정보</button>
        </nav>
        <button onclick="openAddModal(selectedDate)" aria-label="일정 추가"
                class="fab mobile-only w-14 h-14 rounded-full bg-netRed hover:bg-[#b8070f] text-white text-2xl shadow-xl shadow-red-900/40 flex items-center justify-center">
            <i class="fa-solid fa-plus"></i>
        </button>
    </div>

    <!-- 3. 모달: 일정 등록 / 수정 -->
    <div id="add-modal" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4 opacity-0">
        <div class="sheet w-full max-w-md overflow-hidden max-h-[95dvh] overflow-y-auto">
            <div class="sheet-handle"></div>
            <div class="px-5 pt-4 pb-3 flex justify-between items-center">
                <h3 id="modal-title" class="text-xl font-extrabold">새 일정 등록</h3>
                <button onclick="closeModal('add-modal')" class="w-9 h-9 rounded-full hover:bg-white/10 text-gray-400 hover:text-white" aria-label="닫기"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="px-5 pb-2 space-y-4">
                <input type="text" id="ev-title" maxlength="100" class="net-input text-lg font-bold" placeholder="일정 제목 (예: 강남 맛집 체험)">

                <div>
                    <span class="label">일정 종류</span>
                    <select id="ev-category" class="hidden" onchange="onCategoryChange()">
                        <option value="회사 일정">회사 일정</option>
                        <option value="개인 일정">개인 일정</option>
                        <option value="블로그 협찬">블로그 협찬</option>
                    </select>
                    <div class="seg" id="cat-seg">
                        <button type="button" data-v="회사 일정" onclick="pickCategory(this.dataset.v)"><i class="fa-solid fa-briefcase mr-1"></i>회사</button>
                        <button type="button" data-v="개인 일정" onclick="pickCategory(this.dataset.v)"><i class="fa-regular fa-user mr-1"></i>개인</button>

    <script>
        // ===== 설정 =====
        // Firebase 웹 설정값 (공개되어도 괜찮은 값입니다. 접근 제어는 firestore.rules 가 담당)
        // 배포 사이트에서는 로그인 처리 주소를 사이트와 같은 도메인으로 둔다
        // (아이폰 Safari / 홈 화면 앱이 다른 도메인 쿠키를 막아 로그인이 풀리는 문제 방지)
        const HOSTED = ['x-vector-455405-i9.web.app', 'x-vector-455405-i9.firebaseapp.com'];
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyBohWf90tqRG9XpLfGO3rUTDWs5LipUbjc",
            authDomain: HOSTED.includes(location.hostname) ? location.hostname : "x-vector-455405-i9.firebaseapp.com",

        firebase.initializeApp(FIREBASE_CONFIG);
